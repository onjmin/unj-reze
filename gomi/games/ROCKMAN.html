<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROCKMAN ロックマン</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a1a;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      touch-action: none;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
    }

    #ui {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .health-bar {
      display: flex;
      gap: 2px;
      align-items: center;
    }

    .hp-pip {
      width: 8px;
      height: 14px;
      background: #00e5ff;
      border: 1px solid #004d6e;
    }

    .hp-pip.empty {
      background: #1a1a2e;
    }

    #score-display {
      color: #fff;
      font-size: 12px;
      text-align: right;
      line-height: 1.4;
    }

    #controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active,
    .btn.pressed {
      background: rgba(255, 255, 255, 0.35);
      border-color: rgba(255, 255, 255, 0.7);
    }

    .btn-jump {
      background: rgba(255, 200, 0, 0.2);
      border-color: rgba(255, 200, 0, 0.6);
    }

    .btn-shoot {
      background: rgba(0, 200, 255, 0.2);
      border-color: rgba(0, 200, 255, 0.6);
    }

    #screen-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 20;
      font-family: 'Courier New', monospace;
    }

    #screen-overlay h1 {
      font-size: 28px;
      color: #00e5ff;
      text-shadow: 0 0 20px #00e5ff;
      margin-bottom: 8px;
      letter-spacing: 3px;
    }

    #screen-overlay p {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }

    .start-btn {
      margin-top: 20px;
      padding: 12px 32px;
      background: #00e5ff;
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
    }

    #boss-bar {
      position: fixed;
      top: 40px;
      left: 12px;
      right: 12px;
      display: none;
      z-index: 10;
      pointer-events: none;
    }

    #boss-bar-label {
      color: #ff4444;
      font-size: 10px;
      margin-bottom: 3px;
    }

    #boss-bar-track {
      height: 8px;
      background: #1a1a1a;
      border: 1px solid #444;
    }

    #boss-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff2222, #ff6666);
      transition: width 0.1s;
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas"></canvas>

  <div id="ui">
    <div>
      <div style="font-size:10px;color:#aaa;margin-bottom:3px;">ROCK</div>
      <div class="health-bar" id="player-hp"></div>
    </div>
    <div id="score-display">
      <div>SCORE <span id="score">000000</span></div>
      <div>STAGE <span id="stage-num">1</span></div>
    </div>
  </div>

  <div id="boss-bar">
    <div id="boss-bar-label">BOSS</div>
    <div id="boss-bar-track">
      <div id="boss-bar-fill"></div>
    </div>
  </div>

  <div id="controls">
    <div class="btn-group">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
    <div class="btn-group">
      <div class="btn btn-shoot" id="btn-shoot">射</div>
      <div class="btn btn-jump" id="btn-jump">跳</div>
    </div>
  </div>

  <div id="screen-overlay">
    <h1>ROCKMAN</h1>
    <p style="color:#00e5ff;font-size:16px;margin-bottom:12px;">ロックマン</p>
    <p>← → 移動　跳 ジャンプ　射 ショット</p>
    <p style="color:#ff4444;margin-top:4px;">ボスを倒してクリア！</p>
    <p style="color:#888;font-size:11px;margin-top:8px;">PC: 矢印キー移動 / スペース・↑ ジャンプ / Z ショット</p>
    <button class="start-btn" onclick="startGame()">GAME START</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let W, H, SCALE;
    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
      SCALE = Math.min(W, H) / 320;
    }
    resize();
    window.addEventListener('resize', resize);

    const TILE = 16;
    const keys = { left: false, right: false, jump: false, shoot: false };
    let jumpPressed = false;
    let gameState = 'title';
    let score = 0, currentStage = 1, frameCount = 0;

    const STAGES = [
      { bg: '#0a0a2a', platform: '#3355aa', accent: '#5577cc', bossColor: '#cc4444', bossName: 'カットマン' },
      { bg: '#0a1a0a', platform: '#2a6633', accent: '#44aa55', bossColor: '#aa6600', bossName: 'ガッツマン' },
      { bg: '#1a0a0a', platform: '#662222', accent: '#994444', bossColor: '#6644aa', bossName: 'ファイヤーマン' },
    ];

    let stageData;
    let player, bullets, enemies, particles, platforms, boss;
    let camera = { x: 0, y: 0 };

    function startGame() {
      document.getElementById('screen-overlay').style.display = 'none';
      currentStage = 1;
      score = 0;
      initStage();
      gameState = 'playing';
      loop();
    }

    function initStage() {
      stageData = STAGES[(currentStage - 1) % STAGES.length];
      document.getElementById('stage-num').textContent = currentStage;

      player = {
        x: 2 * TILE, y: 10 * TILE, w: 12, h: 14,
        vx: 0, vy: 0, onGround: false,
        hp: 28, maxHp: 28,
        dir: 1, shootCool: 0,
        invincible: 0, blinkTimer: 0,
        dead: false
      };

      bullets = [];
      enemies = [];
      particles = [];

      platforms = buildPlatforms(50, 20);
      boss = null;
      document.getElementById('boss-bar').style.display = 'none';

      spawnEnemies(platforms, 50);

      camera = { x: 0, y: 0 };
      updateHP();
    }

    function buildPlatforms(mapW, mapH) {
      const plats = [];
      const floorY = 16 * TILE;

      for (let x = 0; x < mapW; x++) {
        plats.push({ x: x * TILE, y: floorY, w: TILE, h: TILE * 4, type: 'ground' });
      }

      const layouts = [
        { x: 4, y: 12, w: 5 }, { x: 8, y: 10, w: 4 }, { x: 14, y: 11, w: 6 },
        { x: 11, y: 8, w: 3 }, { x: 17, y: 9, w: 4 }, { x: 22, y: 7, w: 5 },
        { x: 20, y: 11, w: 3 }, { x: 26, y: 10, w: 4 }, { x: 28, y: 8, w: 3 },
        { x: 31, y: 11, w: 5 }, { x: 34, y: 9, w: 4 }, { x: 38, y: 7, w: 6 },
        { x: 36, y: 11, w: 3 }, { x: 42, y: 10, w: 5 }, { x: 44, y: 8, w: 4 },
      ];
      for (const l of layouts) {
        plats.push({ x: l.x * TILE, y: l.y * TILE, w: l.w * TILE, h: TILE, type: 'platform' });
      }

      plats.push({ x: 46 * TILE, y: 9 * TILE, w: 4 * TILE, h: 7 * TILE + TILE * 4, type: 'boss_room' });

      return plats;
    }

    function spawnEnemies(plats, mapW) {
      const groundY = 16 * TILE;
      const positions = [
        { x: 6, onGround: true }, { x: 10, onGround: false, py: 12 },
        { x: 15, onGround: true }, { x: 18, onGround: false, py: 9 },
        { x: 23, onGround: true }, { x: 25, onGround: false, py: 11 },
        { x: 29, onGround: true }, { x: 32, onGround: false, py: 9 },
        { x: 36, onGround: true }, { x: 39, onGround: false, py: 7 },
        { x: 43, onGround: true }, { x: 45, onGround: false, py: 8 },
      ];

      const types = ['met', 'cannon', 'picopico'];
      positions.forEach((pos, i) => {
        const type = types[i % types.length];
        const ey = pos.onGround ? groundY - 16 : (pos.py * TILE);
        enemies.push({
          x: pos.x * TILE, y: ey, w: 14, h: 14,
          vx: type === 'met' ? 1 : 0, vy: 0,
          hp: type === 'cannon' ? 2 : 1,
          maxHp: type === 'cannon' ? 2 : 1,
          type, dir: -1, onGround: true,
          shootTimer: type === 'cannon' ? 120 + i * 30 : 0,
          hide: type === 'met', hideTimer: 60,
          active: false
        });
      });
    }

    function spawnBoss() {
      boss = {
        x: 47 * TILE, y: 12 * TILE,
        w: 28, h: 28,
        hp: 28, maxHp: 28,
        vx: 0, vy: 0,
        onGround: false,
        timer: 0,
        shootTimer: 60,
        jumpTimer: 90,
        dir: -1, invincible: 0,
      };
      document.getElementById('boss-bar').style.display = 'block';
    }

    function collision(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function resolveAABB(entity, plats) {
      entity.onGround = false;
      for (const p of plats) {
        if (!collision(entity, p)) continue;
        const ox = (entity.x + entity.w / 2) - (p.x + p.w / 2);
        const oy = (entity.y + entity.h / 2) - (p.y + p.h / 2);
        const hw = entity.w / 2 + p.w / 2;
        const hh = entity.h / 2 + p.h / 2;
        const dx = hw - Math.abs(ox);
        const dy = hh - Math.abs(oy);
        if (dx < dy) {
          entity.x += ox > 0 ? dx : -dx;
          entity.vx = 0;
        } else {
          entity.y += oy > 0 ? dy : -dy;
          if (oy < 0) { entity.onGround = true; entity.vy = 0; }
          else entity.vy = 0;
        }
      }
    }

    function spawnParticle(x, y, color, count = 6) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
          x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          life: 20 + Math.random() * 20, maxLife: 40, color, r: 2 + Math.random() * 2
        });
      }
    }

    function updatePlayer() {
      if (player.dead) return;

      const spd = 2.5;
      if (keys.left) { player.vx = -spd; player.dir = -1; }
      else if (keys.right) { player.vx = spd; player.dir = 1; }
      else player.vx *= 0.7;

      if (keys.jump && player.onGround) { player.vy = -6; player.onGround = false; }
      player.vy += 0.35;
      if (player.vy > 8) player.vy = 8;

      player.x += player.vx;
      player.y += player.vy;

      resolveAABB(player, platforms);

      if (player.shootCool > 0) player.shootCool--;
      if (keys.shoot && player.shootCool <= 0) {
        bullets.push({ x: player.x + (player.dir > 0 ? player.w : 0), y: player.y + 5, vx: 8 * player.dir, vy: 0, w: 6, h: 4, owner: 'player' });
        player.shootCool = 15;
      }

      if (player.invincible > 0) { player.invincible--; player.blinkTimer++; }
      if (player.y > 22 * TILE) playerDie();
      player.x = Math.max(0, player.x);
    }

    function playerDie() {
      if (player.dead) return;
      player.dead = true;
      spawnParticle(player.x + 6, player.y + 7, '#00e5ff', 16);
      setTimeout(() => {
        if (player.hp <= 0) { gameOver(); return; }
        player.x = Math.max(0, camera.x + 20);
        player.y = 13 * TILE;
        player.vy = 0; player.vx = 0;
        player.dead = false;
        player.invincible = 120;
      }, 600);
    }

    function updateEnemies() {
      const groundY = 16 * TILE;
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (!e.active) {
          if (Math.abs(e.x - player.x) < W / SCALE * 0.8) e.active = true;
          continue;
        }
        if (e.type === 'met') {
          if (e.hideTimer > 0) { e.hideTimer--; e.hide = true; continue; }
          e.hide = false;
          e.vx = 1.5 * e.dir;
          e.x += e.vx;
          if (e.x < 0 || e.x > 50 * TILE) e.dir *= -1;
          e.vy += 0.3; e.y += e.vy;
          if (e.y >= groundY - 14) { e.y = groundY - 14; e.vy = 0; e.onGround = true; }
          if (e.onGround && Math.abs(player.x - e.x) < 80 && Math.random() < 0.005) {
            e.hideTimer = 60 + Math.floor(Math.random() * 60);
          }
        } else if (e.type === 'cannon') {
          e.shootTimer--;
          if (e.shootTimer <= 0) {
            const dx = player.x - e.x, dy = player.y - e.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            bullets.push({ x: e.x + 7, y: e.y + 7, vx: dx / dist * 3.5, vy: dy / dist * 3.5, w: 5, h: 5, owner: 'enemy' });
            e.shootTimer = 120;
          }
        } else if (e.type === 'picopico') {
          e.x += e.dir * 1.2;
          e.vy += 0.3; e.y += e.vy;
          if (e.y >= groundY - 14) { e.y = groundY - 14; e.vy = 0; }
          if (e.x < camera.x - 20 || e.x > camera.x + W / SCALE + 20) e.dir *= -1;
        }
      }
    }

    function updateBoss() {
      if (!boss) return;
      boss.timer++;
      boss.vy += 0.3;
      if (boss.vy > 8) boss.vy = 8;
      boss.x += boss.vx;
      boss.y += boss.vy;

      const groundY = 16 * TILE;
      if (boss.y + boss.h >= groundY) { boss.y = groundY - boss.h; boss.vy = 0; boss.onGround = true; }
      boss.vx *= 0.85;

      boss.jumpTimer--;
      if (boss.jumpTimer <= 0 && boss.onGround) {
        boss.vy = -7; boss.vx = (player.x < boss.x ? -1 : 1) * 3;
        boss.jumpTimer = 80 + Math.floor(Math.random() * 60);
      }
      boss.shootTimer--;
      if (boss.shootTimer <= 0) {
        const angles = boss.hp < boss.maxHp / 2 ? [-0.3, 0, 0.3] : [0];
        for (const a of angles) {
          const dx = player.x - boss.x, dy = player.y - boss.y;
          const base = Math.atan2(dy, dx);
          bullets.push({ x: boss.x + 14, y: boss.y + 14, vx: Math.cos(base + a) * 4, vy: Math.sin(base + a) * 4, w: 8, h: 8, owner: 'enemy' });
        }
        boss.shootTimer = boss.hp < boss.maxHp / 2 ? 50 : 80;
        spawnParticle(boss.x + 14, boss.y + 14, stageData.bossColor, 4);
      }
      if (boss.invincible > 0) boss.invincible--;

      const bossBar = document.getElementById('boss-bar-fill');
      bossBar.style.width = (boss.hp / boss.maxHp * 100) + '%';

      if (boss.hp <= 0) {
        spawnParticle(boss.x + 14, boss.y + 14, stageData.bossColor, 30);
        document.getElementById('boss-bar').style.display = 'none';
        score += 10000;
        boss = null;
        setTimeout(() => stageComplete(), 800);
      }
    }

    function updateBullets() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx; b.y += b.vy;

        let hit = false;
        for (const p of platforms) {
          if (collision(b, p)) { hit = true; spawnParticle(b.x, b.y, b.owner === 'player' ? '#88ccff' : '#ff8844', 3); break; }
        }
        if (hit) { bullets.splice(i, 1); continue; }

        if (b.x < camera.x - 20 || b.x > camera.x + W / SCALE + 20 || b.y < -20 || b.y > 22 * TILE) {
          bullets.splice(i, 1); continue;
        }

        if (b.owner === 'player') {
          let killed = false;
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (e.hide) continue;
            if (collision(b, e)) {
              e.hp--;
              spawnParticle(e.x + 7, e.y + 7, '#ffdd44', 5);
              if (e.hp <= 0) { spawnParticle(e.x + 7, e.y + 7, '#ff8844', 10); enemies.splice(j, 1); score += 200; updateScore(); }
              bullets.splice(i, 1); killed = true; break;
            }
          }
          if (!killed && boss && boss.invincible <= 0 && collision(b, boss)) {
            boss.hp--;
            boss.invincible = 12;
            spawnParticle(b.x, b.y, '#ffdd44', 6);
            score += 100; updateScore();
            bullets.splice(i, 1);
          }
        } else if (b.owner === 'enemy' && !player.dead) {
          if (player.invincible <= 0 && collision(b, player)) {
            damagePlayer(2);
            spawnParticle(player.x + 6, player.y + 7, '#ff4444', 6);
            bullets.splice(i, 1);
          }
        }
      }

      if (boss && boss.invincible <= 0 && !player.dead && player.invincible <= 0) {
        if (collision(player, boss)) damagePlayer(3);
      }
      for (const e of enemies) {
        if (!e.hide && !player.dead && player.invincible <= 0 && collision(player, e)) damagePlayer(2);
      }
    }

    function damagePlayer(amount) {
      if (player.invincible > 0 || player.dead) return;
      player.hp -= amount;
      player.invincible = 90;
      player.blinkTimer = 0;
      if (player.hp <= 0) { player.hp = 0; playerDie(); }
      updateHP();
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function updateCamera() {
      const targetX = player.x - W / SCALE / 2;
      camera.x += (targetX - camera.x) * 0.1;
      camera.x = Math.max(0, Math.min(camera.x, 50 * TILE - W / SCALE));
      if (player.x > 45 * TILE && !boss) spawnBoss();
    }

    function updateScore() {
      document.getElementById('score').textContent = String(score).padStart(6, '0');
    }

    function updateHP() {
      const container = document.getElementById('player-hp');
      container.innerHTML = '';
      for (let i = 0; i < player.maxHp; i += 2) {
        const pip = document.createElement('div');
        pip.className = 'hp-pip' + (i < player.hp ? '' : ' empty');
        container.appendChild(pip);
      }
    }

    function stageComplete() {
      currentStage++;
      if (currentStage > 3) showEndScreen();
      else showStageScreen();
    }

    function showStageScreen() {
      const overlay = document.getElementById('screen-overlay');
      overlay.innerHTML = `<h1>STAGE ${currentStage}</h1>
    <p style="color:#aaa;margin-top:8px;">次のステージへ進め！</p>
    <button class="start-btn" onclick="nextStage()">NEXT STAGE</button>`;
      overlay.style.display = 'flex';
    }

    function nextStage() {
      document.getElementById('screen-overlay').style.display = 'none';
      initStage();
    }

    function gameOver() {
      const overlay = document.getElementById('screen-overlay');
      overlay.innerHTML = `<h1 style="color:#ff4444">GAME OVER</h1>
    <p style="margin-top:12px;">SCORE: ${String(score).padStart(6, '0')}</p>
    <button class="start-btn" style="background:#ff4444" onclick="restartGame()">RETRY</button>`;
      overlay.style.display = 'flex';
    }

    function restartGame() {
      score = 0; currentStage = 1;
      document.getElementById('screen-overlay').style.display = 'none';
      initStage();
    }

    function showEndScreen() {
      const overlay = document.getElementById('screen-overlay');
      overlay.innerHTML = `<h1 style="color:#ffd700;text-shadow:0 0 20px #ffd700">GAME CLEAR!</h1>
    <p style="color:#ffd700;font-size:18px;margin-top:8px;">全ボスを撃破！</p>
    <p style="margin-top:12px;color:#aaa">最終スコア: <span style="color:#fff;font-size:18px">${String(score).padStart(6, '0')}</span></p>
    <button class="start-btn" style="background:#ffd700;color:#000;margin-top:16px" onclick="restartGame()">PLAY AGAIN</button>`;
      overlay.style.display = 'flex';
    }

    function drawBackground() {
      ctx.fillStyle = stageData.bg;
      ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 60; i++) {
        const sx = ((i * 137 + 17) % 320) * SCALE - (camera.x * SCALE * 0.15) % (W * 1.2);
        const sy = ((i * 73 + 5) % 160) * SCALE;
        const alpha = 0.1 + (i % 3) * 0.08;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        const size = (1 + i % 2) * SCALE;
        ctx.fillRect(sx, sy, size, size);
      }
    }

    function drawPlatforms() {
      const s = SCALE;
      for (const p of platforms) {
        const px = (p.x - camera.x) * SCALE;
        if (px > W + TILE * SCALE || px < -TILE * SCALE * 2) continue;
        if (p.type === 'ground') {
          ctx.fillStyle = stageData.platform;
          ctx.fillRect(px, p.y * s, p.w * s + 1, p.h * s);
          ctx.fillStyle = stageData.accent;
          ctx.fillRect(px, p.y * s, p.w * s + 1, 2 * s);
          ctx.fillStyle = 'rgba(0,0,0,0.2)';
          ctx.fillRect(px, p.y * s + 3 * s, p.w * s + 1, 1 * s);
        } else if (p.type === 'platform') {
          ctx.fillStyle = stageData.accent;
          ctx.fillRect(px, p.y * s, p.w * s + 1, p.h * s);
          ctx.fillStyle = 'rgba(255,255,255,0.25)';
          ctx.fillRect(px, p.y * s, p.w * s + 1, 2 * s);
        } else if (p.type === 'boss_room') {
          ctx.fillStyle = '#1a0000';
          ctx.fillRect(px, p.y * s, p.w * s + 1, p.h * s);
          if (frameCount % 60 < 30) {
            ctx.fillStyle = 'rgba(255,0,0,0.05)';
            ctx.fillRect(px, p.y * s, p.w * s + 1, p.h * s);
          }
        }
      }
    }

    function drawPlayer() {
      if (player.dead) return;
      if (player.invincible > 0 && player.blinkTimer % 6 < 3) return;

      const px = (player.x - camera.x) * SCALE;
      const py = player.y * SCALE;
      const s = SCALE;
      const dir = player.dir;

      ctx.save();
      if (dir < 0) { ctx.scale(-1, 1); ctx.translate(-(px + player.w * s), 0); }
      else ctx.translate(px, 0);

      ctx.fillStyle = '#66aaff';
      ctx.fillRect(1 * s, py, 10 * s, 14 * s);
      ctx.fillStyle = '#88ccff';
      ctx.fillRect(2 * s, py + 1 * s, 8 * s, 5 * s);
      ctx.fillStyle = '#ffddaa';
      ctx.fillRect(3 * s, py + 2 * s, 6 * s, 4 * s);
      ctx.fillStyle = '#4488ee';
      ctx.fillRect(0, py + 5 * s, 12 * s, 7 * s);
      ctx.fillStyle = '#2266cc';
      ctx.fillRect(1 * s, py + 5 * s, 10 * s, 2 * s);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(4 * s, py + 3 * s, 2 * s, 2 * s);
      ctx.fillStyle = '#000000';
      ctx.fillRect(4.5 * s, py + 3.5 * s, 1 * s, 1 * s);
      ctx.fillStyle = '#88aaff';
      ctx.fillRect(0, py + 7 * s, 3 * s, 4 * s);
      if (player.shootCool > 10) {
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(12 * s, py + 7 * s, 4 * s, 3 * s);
      }
      ctx.restore();
    }

    function drawEnemy(e) {
      const ex = (e.x - camera.x) * SCALE;
      const ey = e.y * SCALE;
      if (ex > W + 20 || ex < -20 || ey > H + 20) return;
      const s = SCALE;

      if (e.hide) {
        ctx.fillStyle = '#999933';
        ctx.fillRect(ex, ey + 8 * s, e.w * s, 6 * s);
        ctx.fillStyle = '#bbbb44';
        ctx.beginPath();
        ctx.arc(ex + 7 * s, ey + 10 * s, 5 * s, 0, Math.PI * 2);
        ctx.fill();
        return;
      }

      if (e.type === 'met') {
        ctx.fillStyle = '#ccaa33'; ctx.fillRect(ex + 2 * s, ey + 4 * s, 10 * s, 10 * s);
        ctx.fillStyle = '#ffdd55'; ctx.fillRect(ex + 1 * s, ey + 1 * s, 12 * s, 8 * s);
        ctx.fillStyle = '#888822';
        ctx.fillRect(ex, ey + 3 * s, 3 * s, 5 * s);
        ctx.fillRect(ex + 11 * s, ey + 3 * s, 3 * s, 5 * s);
        ctx.fillStyle = '#000';
        ctx.fillRect(ex + 4 * s, ey + 4 * s, 2 * s, 2 * s);
        ctx.fillRect(ex + 8 * s, ey + 4 * s, 2 * s, 2 * s);
      } else if (e.type === 'cannon') {
        ctx.fillStyle = '#884422'; ctx.fillRect(ex + 1 * s, ey + 4 * s, 12 * s, 10 * s);
        ctx.fillStyle = '#aa5533'; ctx.fillRect(ex + 2 * s, ey + 2 * s, 10 * s, 8 * s);
        ctx.fillStyle = '#663311'; ctx.fillRect(ex + 11 * s, ey + 6 * s, 5 * s, 4 * s);
        ctx.fillStyle = '#ff4400';
        ctx.fillRect(ex + 4 * s, ey + 4 * s, 2 * s, 2 * s);
        ctx.fillRect(ex + 8 * s, ey + 4 * s, 2 * s, 2 * s);
      } else {
        ctx.fillStyle = '#33aa44'; ctx.fillRect(ex + 1 * s, ey + 2 * s, 12 * s, 12 * s);
        ctx.fillStyle = '#44cc55'; ctx.fillRect(ex + 2 * s, ey + 1 * s, 10 * s, 8 * s);
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(ex + 3 * s, ey + 3 * s, 2 * s, 2 * s);
        ctx.fillRect(ex + 9 * s, ey + 3 * s, 2 * s, 2 * s);
        ctx.fillStyle = '#22882a'; ctx.fillRect(ex + 4 * s, ey + 7 * s, 6 * s, 3 * s);
      }
    }

    function drawBoss() {
      if (!boss) return;
      const bx = (boss.x - camera.x) * SCALE;
      const by = boss.y * SCALE;
      const s = SCALE;
      const blink = boss.invincible > 0 && Math.floor(boss.invincible / 4) % 2 === 0;

      ctx.fillStyle = blink ? '#ffffff' : stageData.bossColor;
      ctx.fillRect(bx + 2 * s, by + 4 * s, 24 * s, 20 * s);
      ctx.fillStyle = blink ? '#ffbbbb' : '#ff8888';
      ctx.fillRect(bx + 4 * s, by + 2 * s, 20 * s, 16 * s);
      ctx.fillStyle = '#000';
      ctx.fillRect(bx + 7 * s, by + 5 * s, 4 * s, 4 * s);
      ctx.fillRect(bx + 17 * s, by + 5 * s, 4 * s, 4 * s);
      ctx.fillStyle = '#ff2222';
      ctx.fillRect(bx + 9 * s, by + 6 * s, 2 * s, 2 * s);
      ctx.fillRect(bx + 19 * s, by + 6 * s, 2 * s, 2 * s);
      ctx.fillStyle = '#ff4444'; ctx.fillRect(bx + 8 * s, by + 12 * s, 12 * s, 3 * s);
      ctx.fillStyle = '#333';
      ctx.fillRect(bx, by + 10 * s, 4 * s, 8 * s);
      ctx.fillRect(bx + 24 * s, by + 10 * s, 4 * s, 8 * s);

      document.getElementById('boss-bar-label').textContent = stageData.bossName;
    }

    function drawBullets() {
      for (const b of bullets) {
        const bx = (b.x - camera.x) * SCALE;
        const by = b.y * SCALE;
        if (b.owner === 'player') {
          ctx.fillStyle = '#44ddff';
          ctx.shadowBlur = 4; ctx.shadowColor = '#44ddff';
          ctx.fillRect(bx, by, b.w * SCALE, b.h * SCALE);
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = '#ff6644';
          ctx.fillRect(bx, by, b.w * SCALE, b.h * SCALE);
        }
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.fillRect((p.x - camera.x) * SCALE - p.r, p.y * SCALE - p.r, p.r * 2, p.r * 2);
      }
      ctx.globalAlpha = 1;
    }

    function loop() {
      if (gameState !== 'playing') return;
      frameCount++;

      ctx.clearRect(0, 0, W, H);
      drawBackground();
      drawPlatforms();

      updatePlayer();
      updateEnemies();
      updateBoss();
      updateBullets();
      updateParticles();
      updateCamera();

      drawBullets();
      for (const e of enemies) drawEnemy(e);
      drawBoss();
      drawPlayer();
      drawParticles();

      requestAnimationFrame(loop);
    }

    function setupControls() {
      const btnDown = {
        'btn-left': () => { keys.left = true; },
        'btn-right': () => { keys.right = true; },
        'btn-jump': () => { if (!jumpPressed) { keys.jump = true; jumpPressed = true; } },
        'btn-shoot': () => { keys.shoot = true; }
      };
      const btnUp = {
        'btn-left': () => { keys.left = false; },
        'btn-right': () => { keys.right = false; },
        'btn-jump': () => { keys.jump = false; jumpPressed = false; },
        'btn-shoot': () => { keys.shoot = false; }
      };

      Object.keys(btnDown).forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('touchstart', e => { e.preventDefault(); btnDown[id](); el.classList.add('pressed'); }, { passive: false });
        el.addEventListener('touchend', e => { e.preventDefault(); btnUp[id](); el.classList.remove('pressed'); }, { passive: false });
        el.addEventListener('mousedown', () => { btnDown[id](); el.classList.add('pressed'); });
        el.addEventListener('mouseup', () => { btnUp[id](); el.classList.remove('pressed'); });
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
        if ((e.key === 'ArrowUp' || e.key === ' ') && !jumpPressed) { keys.jump = true; jumpPressed = true; e.preventDefault(); }
        if (e.key === 'z' || e.key === 'Z') keys.shoot = true;
      });
      document.addEventListener('keyup', e => {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
        if (e.key === 'ArrowUp' || e.key === ' ') { keys.jump = false; jumpPressed = false; }
        if (e.key === 'z' || e.key === 'Z') keys.shoot = false;
      });
    }

    setupControls();
  </script>
</body>
