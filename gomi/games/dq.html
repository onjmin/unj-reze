<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ドラゴンクエスト</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #000;
    --grass1: #4a8a3a;
    --grass2: #57993f;
    --water: #2b5d9e;
    --mountain: #7a6a52;
    --tree: #2d6a2a;
    --win-bg: #06081a;
    --win-border: #f4f4f8;
    --text: #f4f4f8;
    --muted: #9fb0c0;
    --accent: #ffd23f;
    --hp: #4caf50;
    --hp-low: #f44336;
    --mp: #5b9bd5;
    --radius: 8px;
  }
  html, body { height: 100%; overflow: hidden; background: #000; }
  body {
    font-family: 'Courier New', 'Segoe UI', monospace;
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    background: #000;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  /* ===== SCREENS ===== */
  .screen { display: none; flex-direction: column; height: 100%; }
  .screen.active { display: flex; }

  /* ===== TITLE ===== */
  #title-screen {
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: radial-gradient(ellipse at 50% 30%, #14306b 0%, #050616 75%);
    padding: 24px;
    text-align: center;
  }
  .title-crest { font-size: 4.5rem; filter: drop-shadow(0 0 18px rgba(255,210,63,0.6)); animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .title-logo {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: 0 2px 0 #a86a00, 0 0 22px rgba(255,210,63,0.5);
    line-height: 1.3;
  }
  .title-sub { color: var(--muted); font-size: 0.82rem; line-height: 1.6; }
  .menu-btn {
    background: var(--win-bg);
    border: 3px solid var(--win-border);
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    padding: 12px 36px;
    border-radius: var(--radius);
    cursor: pointer;
    min-width: 200px;
    transition: transform 0.08s, background 0.1s;
  }
  .menu-btn:active { transform: scale(0.96); }
  .menu-btn:disabled { opacity: 0.4; }
  .menu-btn.primary { background: #1a2b5c; border-color: var(--accent); color: var(--accent); }

  /* ===== HUD ===== */
  #hud {
    display: flex;
    gap: 6px;
    padding: 6px 8px;
    background: var(--win-bg);
    border-bottom: 2px solid var(--win-border);
    font-size: 0.72rem;
    flex-shrink: 0;
    align-items: center;
  }
  .hud-chip {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 6px;
    padding: 3px 7px;
    white-space: nowrap;
  }
  .hud-chip b { color: var(--accent); font-weight: 700; }
  .hud-name { font-weight: 700; color: var(--text); }
  .hud-spacer { flex: 1; }

  /* ===== FIELD / MAP ===== */
  #field-screen { background: #050616; }
  #map-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    background: #050616;
  }
  #map-canvas { display: block; image-rendering: pixelated; }

  /* On-screen controls */
  #controls {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px 16px;
    gap: 10px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.4));
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 46px);
    grid-template-rows: repeat(3, 46px);
    gap: 3px;
  }
  .dbtn {
    background: var(--win-bg);
    border: 2px solid var(--win-border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1.3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.05s, transform 0.05s;
  }
  .dbtn:active { background: #2a3b6c; transform: scale(0.93); }
  .dbtn.blank { visibility: hidden; }
  #d-up { grid-area: 1/2; } #d-left { grid-area: 2/1; }
  #d-right { grid-area: 2/3; } #d-down { grid-area: 3/2; }
  .dpad-center { grid-area: 2/2; background: rgba(255,255,255,0.04); border-radius:6px; }
  .act-col { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .act-btn {
    background: var(--win-bg);
    border: 2px solid var(--win-border);
    border-radius: 50%;
    width: 58px; height: 58px;
    color: var(--text);
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    line-height: 1.1;
    transition: background 0.05s, transform 0.05s;
  }
  .act-btn:active { background: #2a3b6c; transform: scale(0.93); }
  .act-btn .ico { font-size: 1.1rem; }
  .act-btn.a { border-color: var(--accent); }

  /* ===== DQ WINDOW / MODAL ===== */
  #modal-layer {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: flex-end;
    z-index: 50;
    pointer-events: none;
  }
  #modal-layer.active { display: flex; }
  .dq-window {
    background: var(--win-bg);
    border: 3px solid var(--win-border);
    border-radius: 10px;
    margin: 10px;
    padding: 12px 14px;
    pointer-events: auto;
    box-shadow: 0 6px 24px rgba(0,0,0,0.6);
    max-height: 78%;
    overflow-y: auto;
  }
  .dq-title { color: var(--accent); font-weight: 700; font-size: 0.95rem; margin-bottom: 8px; letter-spacing: 1px; }
  .dq-msg { font-size: 0.92rem; line-height: 1.7; white-space: pre-wrap; }
  .dq-msg .more { color: var(--accent); font-size: 0.75rem; margin-top: 6px; animation: blink 0.8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .dq-options { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .dq-opt {
    background: rgba(255,255,255,0.05);
    border: 2px solid transparent;
    border-radius: 7px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 10px 12px;
    text-align: left;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.08s, border-color 0.08s, transform 0.05s;
  }
  .dq-opt:active { transform: scale(0.98); }
  .dq-opt:hover { border-color: rgba(255,210,63,0.5); }
  .dq-opt:disabled { opacity: 0.4; cursor: default; }
  .dq-opt .price { color: var(--accent); font-size: 0.82rem; }
  .dq-opt .sub { color: var(--muted); font-size: 0.75rem; }
  .dq-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  .status-row { display: flex; justify-content: space-between; font-size: 0.88rem; padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.12); }
  .status-row span:last-child { color: var(--accent); font-weight: 700; }

  /* ===== BATTLE ===== */
  #battle-screen { background: #000; }
  .battle-stage {
    flex: 1;
    position: relative;
    background:
      radial-gradient(ellipse at 50% 120%, #243a1c 0%, transparent 60%),
      linear-gradient(180deg, #0a0f24 0%, #131d3a 55%, #1c2b16 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    min-height: 0;
  }
  .battle-stage.boss {
    background:
      radial-gradient(ellipse at 50% 120%, #5a1414 0%, transparent 60%),
      linear-gradient(180deg, #1a0a0a 0%, #2a0f14 55%, #3a1010 100%);
  }
  .enemy-box { text-align: center; position: relative; z-index: 2; }
  .enemy-sprite {
    font-size: 6rem;
    line-height: 1;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
    animation: ebob 2.4s ease-in-out infinite;
    display: block;
  }
  @keyframes ebob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .enemy-name-tag {
    margin-top: 10px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .enemy-hp-wrap { width: 160px; margin: 6px auto 0; }
  .ehp-bg { height: 7px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; overflow: hidden; }
  .ehp-bar { height: 100%; width: 100%; background: var(--hp); border-radius: 3px; transition: width 0.5s ease, background 0.4s; }

  .scene-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 5; }
  .scene-flash.flash { animation: flashAnim 0.18s ease; }
  @keyframes flashAnim { 0%,100%{opacity:0} 40%{opacity:0.55} }
  .anim-ehit { animation: ehit 0.4s ease !important; }
  @keyframes ehit { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-7px)} 80%{transform:translateX(7px)} }
  .anim-efaint { animation: efaint 0.6s ease forwards !important; }
  @keyframes efaint { to { transform: translateY(30px) scale(0.4); opacity: 0; } }
  #battle-screen.shake .battle-stage { animation: stageShake 0.3s ease; }
  @keyframes stageShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  .battle-bottom { flex-shrink: 0; }
  .battle-status {
    display: flex;
    gap: 8px;
    padding: 6px 10px;
    background: var(--win-bg);
    border-top: 2px solid var(--win-border);
    font-size: 0.8rem;
    align-items: center;
  }
  .bstat { display: flex; flex-direction: column; }
  .bstat .lab { color: var(--muted); font-size: 0.62rem; }
  .bstat .val { font-weight: 700; }
  .bstat .val .hpv { color: var(--hp); }
  .bstat .val .mpv { color: var(--mp); }
  .bar-mini { width: 90px; height: 6px; background: rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.25); border-radius:3px; overflow:hidden; margin-top:2px; }
  .bar-mini > div { height: 100%; border-radius: 3px; transition: width 0.4s; }
  .battle-msg {
    background: var(--win-bg);
    border-top: 2px solid var(--win-border);
    padding: 10px 14px;
    min-height: 62px;
    font-size: 0.9rem;
    line-height: 1.6;
  }
  .battle-cmds {
    background: var(--win-bg);
    border-top: 2px solid var(--win-border);
    padding: 8px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .cmd-btn {
    background: rgba(255,255,255,0.05);
    border: 2px solid var(--win-border);
    border-radius: 7px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 13px 8px;
    cursor: pointer;
    transition: background 0.08s, transform 0.05s;
  }
  .cmd-btn:active { transform: scale(0.97); background: #2a3b6c; }
  .cmd-btn:disabled { opacity: 0.4; }
  .battle-sub { display: none; padding: 8px; background: var(--win-bg); border-top: 2px solid var(--win-border); flex-direction: column; gap: 6px; max-height: 40dvh; overflow-y: auto; }
  .battle-sub.visible { display: flex; }

  /* ===== ENDING ===== */
  #ending-screen {
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 28px;
    text-align: center;
    background: radial-gradient(ellipse at 50% 35%, #2a2f6b 0%, #050616 75%);
  }
  .ending-title {
    font-size: 2rem;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 24px rgba(255,210,63,0.6);
    line-height: 1.4;
  }
  .ending-msg { color: var(--text); font-size: 0.95rem; line-height: 1.9; }
  .ending-stats { color: var(--muted); font-size: 0.82rem; line-height: 1.8; }

  .toast {
    position: absolute;
    top: 50px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    border: 2px solid var(--accent);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    z-index: 80;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ===== TITLE ===== -->
<div id="title-screen" class="screen active">
  <div class="title-crest">🐉</div>
  <div class="title-logo">ドラゴン<br>クエスト</div>
  <div class="title-sub">竜王にさらわれた姫を救い<br>世界に平和をとりもどせ</div>
  <button class="menu-btn primary" onclick="newGame()">はじめから</button>
  <button class="menu-btn" id="continue-btn" onclick="continueGame()">つづきから</button>
</div>

<!-- ===== FIELD ===== -->
<div id="field-screen" class="screen">
  <div id="hud">
    <span class="hud-name" id="hud-name">勇者</span>
    <span class="hud-chip">Lv<b id="hud-lv">1</b></span>
    <span class="hud-chip">HP <b id="hud-hp">15</b></span>
    <span class="hud-chip">MP <b id="hud-mp">0</b></span>
    <span class="hud-spacer"></span>
    <span class="hud-chip">G<b id="hud-gold">0</b></span>
  </div>
  <div id="map-wrap"><canvas id="map-canvas"></canvas></div>
  <div id="controls">
    <div class="dpad">
      <div class="dbtn" id="d-up" data-dir="up">▲</div>
      <div class="dbtn" id="d-left" data-dir="left">◀</div>
      <div class="dpad-center"></div>
      <div class="dbtn" id="d-right" data-dir="right">▶</div>
      <div class="dbtn" id="d-down" data-dir="down">▼</div>
    </div>
    <div class="act-col">
      <button class="act-btn" onclick="openMainMenu()"><span class="ico">☰</span>メニュー</button>
      <button class="act-btn a" onclick="actionButton()"><span class="ico">🔍</span>しらべる</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<!-- ===== BATTLE ===== -->
<div id="battle-screen" class="screen">
  <div class="battle-stage" id="battle-stage">
    <div class="scene-flash" id="scene-flash"></div>
    <div class="enemy-box">
      <span class="enemy-sprite" id="enemy-sprite">🟦</span>
      <div class="enemy-name-tag" id="enemy-name">スライム</div>
      <div class="enemy-hp-wrap"><div class="ehp-bg"><div class="ehp-bar" id="enemy-hp-bar"></div></div></div>
    </div>
  </div>
  <div class="battle-bottom">
    <div class="battle-status">
      <div class="bstat">
        <span class="lab">HP</span>
        <span class="val"><span class="hpv" id="b-hp">15</span>/<span id="b-maxhp">15</span></span>
        <div class="bar-mini"><div id="b-hp-bar" style="background:var(--hp);width:100%"></div></div>
      </div>
      <div class="bstat">
        <span class="lab">MP</span>
        <span class="val"><span class="mpv" id="b-mp">0</span>/<span id="b-maxmp">0</span></span>
        <div class="bar-mini"><div id="b-mp-bar" style="background:var(--mp);width:100%"></div></div>
      </div>
      <div class="bstat" style="flex:1;text-align:right;align-items:flex-end">
        <span class="lab">Lv / G</span>
        <span class="val"><span id="b-lv">1</span> / <span style="color:var(--accent)" id="b-gold">0</span>G</span>
      </div>
    </div>
    <div class="battle-msg" id="battle-msg">スライムが あらわれた！</div>
    <div class="battle-cmds" id="battle-cmds">
      <button class="cmd-btn" onclick="cmdAttack()">たたかう</button>
      <button class="cmd-btn" onclick="cmdSpell()">じゅもん</button>
      <button class="cmd-btn" onclick="cmdItem()">どうぐ</button>
      <button class="cmd-btn" onclick="cmdRun()">にげる</button>
    </div>
    <div class="battle-sub" id="battle-sub"></div>
  </div>
</div>

<!-- ===== ENDING ===== -->
<div id="ending-screen" class="screen">
  <div class="title-crest">👑</div>
  <div class="ending-title" id="ending-title">クリア！</div>
  <div class="ending-msg" id="ending-msg"></div>
  <div class="ending-stats" id="ending-stats"></div>
  <button class="menu-btn primary" onclick="location.reload()">タイトルへ</button>
</div>

<!-- ===== MODAL / WINDOW LAYER ===== -->
<div id="modal-layer"></div>

<script>
"use strict";
const SAVE_KEY = 'dq_save_v1';

/* ===================== DATA ===================== */
// Spells learned by level
const SPELLS = {
  hoimi:    { name:'ホイミ',     mp:3,  type:'heal',  min:8,  max:25, lv:1 },
  mera:     { name:'メラ',       mp:2,  type:'attack',min:8,  max:14, lv:2 },
  gira:     { name:'ギラ',       mp:4,  type:'attack',min:16, max:26, lv:5 },
  behoimi:  { name:'ベホイミ',   mp:7,  type:'heal',  min:55, max:90, lv:7 },
  rarihо:   { name:'ラリホー',   mp:3,  type:'sleep', lv:9 },
  begirama: { name:'ベギラマ',   mp:8,  type:'attack',min:34, max:50, lv:13 },
};
const SPELL_LEARN = [
  { lv:1, key:'hoimi' }, { lv:2, key:'mera' }, { lv:5, key:'gira' },
  { lv:7, key:'behoimi' }, { lv:9, key:'rarihо' }, { lv:13, key:'begirama' },
];

// Shop items
const ITEMS = {
  herb:  { name:'やくそう',         desc:'HP30回復', price:8,  use:'heal', power:30 },
  wing:  { name:'キメラのつばさ',   desc:'街へ戻る', price:25, use:'warp' },
  fairy: { name:'まほうのせいすい', desc:'MP20回復', price:120, use:'mp', power:20 },
};

const WEAPONS = [
  { name:'なし',             atk:0,  price:0 },
  { name:'ひのきのぼう',     atk:2,  price:10 },
  { name:'こんぼう',         atk:6,  price:60 },
  { name:'どうのつるぎ',     atk:12, price:200 },
  { name:'てつのおの',       atk:18, price:560 },
  { name:'はがねのつるぎ',   atk:26, price:1500 },
  { name:'ロトのつるぎ',     atk:42, price:2900 },
];
const ARMORS = [
  { name:'たびびとのふく',   def:0,  price:0 },
  { name:'ぬののふく',       def:2,  price:20 },
  { name:'かわのよろい',     def:6,  price:90 },
  { name:'くさりかたびら',   def:12, price:330 },
  { name:'てつのよろい',     def:20, price:1000 },
  { name:'まほうのよろい',   def:28, price:2200 },
  { name:'ロトのよろい',     def:38, price:4500 },
];
const SHIELDS = [
  { name:'なし',           def:0,  price:0 },
  { name:'かわのたて',     def:4,  price:90 },
  { name:'てつのたて',     def:10, price:800 },
  { name:'みかがみのたて', def:18, price:2400 },
];

// Enemies (def = their defense, agi affects their evade-ish via def in calc)
const ENEMIES = {
  slime:    { name:'スライム',     sprite:'🟦', hp:8,   atk:7,  def:3,  exp:4,  gold:3 },
  besu:     { name:'スライムベス', sprite:'🟥', hp:11,  atk:9,  def:4,  exp:6,  gold:5 },
  draky:    { name:'ドラキー',     sprite:'🦇', hp:14,  atk:11, def:6,  exp:9,  gold:8 },
  garas:    { name:'おおがらす',   sprite:'🐦‍⬛', hp:18,  atk:14, def:8,  exp:14, gold:14 },
  meda:     { name:'メーダ',       sprite:'👁️', hp:24,  atk:18, def:10, exp:18, gold:18, spells:['mera'] },
  skeleton: { name:'がいこつ',     sprite:'💀', hp:30,  atk:22, def:14, exp:26, gold:24 },
  madou:    { name:'まどうし',     sprite:'🧙', hp:28,  atk:18, def:12, exp:30, gold:32, spells:['gira','hoimi'] },
  metal:    { name:'メタルスライム',sprite:'⬜', hp:6,   atk:12, def:60, exp:160,gold:90, agi:99, flee:true },
  ghost:    { name:'しりょう',     sprite:'👻', hp:42,  atk:30, def:18, exp:50, gold:48, spells:['rarihо'] },
  knight:   { name:'あくまのきし', sprite:'🛡️', hp:60,  atk:42, def:28, exp:90, gold:80 },
  golem:    { name:'ゴーレム',     sprite:'🗿', hp:90,  atk:50, def:24, exp:140,gold:120 },
};
// Encounter pools by danger tier
const POOLS = [
  ['slime','slime','besu','draky'],                          // 0
  ['besu','draky','garas','meda','metal'],                   // 1
  ['garas','meda','skeleton','madou','metal'],               // 2
  ['skeleton','madou','ghost','knight','golem','metal'],     // 3
];

/* ===================== MAP ===================== */
const MAP_W = 44, MAP_H = 36;
const T_GRASS=0, T_WATER=1, T_MOUNTAIN=2, T_TREE=3, T_TOWN=4, T_BOSS=5, T_BRIDGE=6;
let map = [];
const specials = {}; // "x,y" -> 'town' | 'boss'
let townPos = {x:0,y:0}, bossPos = {x:0,y:0};

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function genMap(){
  const rng = mulberry32(20260613);
  map = [];
  for(let y=0;y<MAP_H;y++){
    const row=[];
    for(let x=0;x<MAP_W;x++){
      let t = T_GRASS;
      const edge = x<1||y<1||x>=MAP_W-1||y>=MAP_H-1;
      if(edge) t = T_WATER;
      else {
        const r = rng();
        if(r<0.06) t = T_WATER;
        else if(r<0.16) t = T_MOUNTAIN;
        else if(r<0.30) t = T_TREE;
      }
      row.push(t);
    }
    map.push(row);
  }
  townPos = {x:9, y:26};
  bossPos = {x:37, y:5};
  clearArea(townPos.x, townPos.y, 2);
  clearArea(bossPos.x, bossPos.y, 2);
  // mountain ring around boss for flavor (leave south gap)
  for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
    const x=bossPos.x+dx, y=bossPos.y+dy;
    if(x<1||y<1||x>=MAP_W-1||y>=MAP_H-1) continue;
    if(Math.max(Math.abs(dx),Math.abs(dy))===3 && !(dy===3)) map[y][x]=T_MOUNTAIN;
  }
  map[townPos.y][townPos.x]=T_TOWN;
  map[bossPos.y][bossPos.x]=T_BOSS;
  specials[`${townPos.x},${townPos.y}`]='town';
  specials[`${bossPos.x},${bossPos.y}`]='boss';
}
function clearArea(cx,cy,r){
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const x=cx+dx,y=cy+dy;
    if(x>=1&&y>=1&&x<MAP_W-1&&y<MAP_H-1) map[y][x]=T_GRASS;
  }
}
function isWalkable(x,y){
  if(x<0||y<0||x>=MAP_W||y>=MAP_H) return false;
  const t=map[y][x];
  return t===T_GRASS||t===T_TOWN||t===T_BOSS||t===T_BRIDGE;
}
function dangerTier(x,y){
  const dB = Math.hypot(x-bossPos.x, y-bossPos.y);
  if(dB<8) return 3;
  if(dB<15) return 2;
  const dT = Math.hypot(x-townPos.x, y-townPos.y);
  if(dT<8) return 0;
  return 1;
}

/* ===================== PLAYER STATE ===================== */
let P = null;
let player = {x:0,y:0,facing:'down'};
let stepsSinceEncounter = 0;
let gameOver = false;

function freshPlayer(){
  P = {
    name:'勇者', lv:1, exp:0,
    hp:15, maxhp:15, mp:0, maxmp:0,
    gold:0,
    weapon:0, armor:0, shield:0,
    spells:['hoimi'],
    items:{ herb:3, wing:0, fairy:0 },
    bossDefeated:false,
  };
  applyLevel(1, true);
  player = {x:townPos.x, y:townPos.y+1, facing:'down'};
  stepsSinceEncounter = 0;
  gameOver = false;
}

// Level -> base stats
function levelStats(lv){
  return {
    maxhp: 14 + Math.floor(lv*7 + lv*lv*0.45),
    maxmp: lv<=1 ? 0 : Math.floor((lv-1)*5 + lv*lv*0.2),
    str:   5 + Math.floor(lv*3.2),
    agi:   4 + Math.floor(lv*2.1),
  };
}
function applyLevel(lv, full){
  const s = levelStats(lv);
  P.lv = lv;
  P.maxhp = s.maxhp; P.maxmp = s.maxmp;
  P.str = s.str; P.agi = s.agi;
  if(full){ P.hp = P.maxhp; P.mp = P.maxmp; }
}
function expForLevel(lv){ return Math.floor(7 * Math.pow(lv, 2.35)); } // total exp to REACH lv
function playerAtk(){ return P.str + WEAPONS[P.weapon].atk; }
function playerDef(){ return Math.floor(P.agi/2) + ARMORS[P.armor].def + SHIELDS[P.shield].def; }

/* ===================== SAVE ===================== */
function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({P, player, stepsSinceEncounter})); }catch(e){}
}
function hasSave(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

/* ===================== SCREENS ===================== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function newGame(){
  genMap();
  freshPlayer();
  showScreen('field-screen');
  resizeCanvas();
  drawMap();
  updateHud();
  saveGame();
  message(['ここは ラダトームの街。','勇者よ、竜王を倒し 世界に平和を！','まずは街で そうびを ととのえよう。'], null, '冒険のはじまり');
}
function continueGame(){
  if(!hasSave()){ return; }
  try{
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    genMap();
    P = d.P; player = d.player; stepsSinceEncounter = d.stepsSinceEncounter||0;
    gameOver=false;
    // backfill new fields if older save
    P.items = Object.assign({herb:0,wing:0,fairy:0}, P.items||{});
  }catch(e){ newGame(); return; }
  showScreen('field-screen');
  resizeCanvas();
  drawMap();
  updateHud();
}

/* ===================== CANVAS / DRAW ===================== */
const canvas = document.getElementById('map-canvas');
const ctx = canvas.getContext('2d');
let VIEW = 9, tile = 36, dpr = 1;

function resizeCanvas(){
  const wrap = document.getElementById('map-wrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const side = Math.min(w, h);
  VIEW = (side < 360) ? 7 : 9;
  tile = Math.floor(side / VIEW);
  const px = tile * VIEW;
  dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.style.width = px+'px';
  canvas.style.height = px+'px';
  canvas.width = px*dpr;
  canvas.height = px*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textAlign='center'; ctx.textBaseline='middle';
}
window.addEventListener('resize', ()=>{ if(document.getElementById('field-screen').classList.contains('active')){ resizeCanvas(); drawMap(); } });

const TILE_EMOJI = { [T_TREE]:'🌲', [T_MOUNTAIN]:'⛰️', [T_TOWN]:'🏰', [T_BOSS]:'🏯' };
function tileBase(t){
  if(t===T_WATER) return '#2b5d9e';
  if(t===T_MOUNTAIN) return '#6f5d44';
  if(t===T_TREE) return '#3d7a33';
  if(t===T_BOSS) return '#4a1414';
  return null; // grass handled by checker
}
function drawMap(){
  const half = Math.floor(VIEW/2);
  const startX = player.x-half, startY = player.y-half;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.font = Math.floor(tile*0.72)+'px serif';
  for(let vy=0;vy<VIEW;vy++){
    for(let vx=0;vx<VIEW;vx++){
      const mx=startX+vx, my=startY+vy;
      const sx=vx*tile, sy=vy*tile;
      // base
      let t = (mx>=0&&my>=0&&mx<MAP_W&&my<MAP_H) ? map[my][mx] : T_WATER;
      const base = tileBase(t);
      if(base){ ctx.fillStyle=base; }
      else { ctx.fillStyle = ((mx+my)%2===0)?'#4a8a3a':'#56993f'; } // grass checker (also under tree)
      ctx.fillRect(sx,sy,tile+1,tile+1);
      if(t===T_TREE){ ctx.fillStyle='#56993f'; ctx.fillRect(sx,sy,tile+1,tile+1); }
      // emoji feature
      const em = TILE_EMOJI[t];
      if(em){ ctx.fillText(em, sx+tile/2, sy+tile/2+1); }
    }
  }
  // player at center
  const cx = half*tile + tile/2, cy = half*tile + tile/2;
  ctx.font = Math.floor(tile*0.8)+'px serif';
  const heroFace = {down:'🧝', up:'🧝', left:'🧝', right:'🧝'}[player.facing] || '🧝';
  ctx.fillText(heroFace, cx, cy+1);
}

/* ===================== MOVEMENT ===================== */
let moveLock = false;
function tryMove(dir){
  if(moveLock || gameOver) return;
  if(modalOpen) return;
  if(!document.getElementById('field-screen').classList.contains('active')) return;
  player.facing = dir;
  let nx=player.x, ny=player.y;
  if(dir==='up') ny--; else if(dir==='down') ny++;
  else if(dir==='left') nx--; else if(dir==='right') nx++;
  if(!isWalkable(nx,ny)){ drawMap(); return; }
  player.x=nx; player.y=ny;
  drawMap();
  const key=`${nx},${ny}`;
  if(specials[key]==='town'){ enterTown(); return; }
  if(specials[key]==='boss'){ approachBoss(); return; }
  // encounter
  saveGame();
  stepsSinceEncounter++;
  const tier = dangerTier(nx,ny);
  const baseChance = 0.10 + tier*0.02;
  if(stepsSinceEncounter>=3 && Math.random()<baseChance){
    stepsSinceEncounter=0;
    startEncounter(tier);
  }
}

/* on-screen + keyboard controls */
function bindHold(el){
  const dir = el.dataset.dir;
  let timer=null;
  const go=()=>{ tryMove(dir); };
  const start=(e)=>{ e.preventDefault(); go(); timer=setInterval(go,180); };
  const stop=()=>{ if(timer){ clearInterval(timer); timer=null; } };
  el.addEventListener('touchstart', start, {passive:false});
  el.addEventListener('touchend', stop);
  el.addEventListener('touchcancel', stop);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', stop);
  el.addEventListener('mouseleave', stop);
}
document.querySelectorAll('.dbtn[data-dir]').forEach(bindHold);
window.addEventListener('keydown', (e)=>{
  const k=e.key;
  if(['ArrowUp','w','W'].includes(k)) tryMove('up');
  else if(['ArrowDown','s','S'].includes(k)) tryMove('down');
  else if(['ArrowLeft','a','A'].includes(k)) tryMove('left');
  else if(['ArrowRight','d','D'].includes(k)) tryMove('right');
  else if(k==='Enter'||k===' ') { e.preventDefault(); if(modalOpen) modalAdvance(); else actionButton(); }
});

function actionButton(){
  if(modalOpen){ modalAdvance(); return; }
  // search facing tile
  let nx=player.x, ny=player.y;
  if(player.facing==='up') ny--; else if(player.facing==='down') ny++;
  else if(player.facing==='left') nx--; else if(player.facing==='right') nx++;
  if(specials[`${nx},${ny}`]==='town'){ enterTown(); return; }
  if(specials[`${nx},${ny}`]==='boss'){ approachBoss(); return; }
  if(specials[`${player.x},${player.y}`]==='town'){ enterTown(); return; }
  toast('なにも みつからなかった。');
}

/* ===================== HUD ===================== */
function updateHud(){
  document.getElementById('hud-name').textContent=P.name;
  document.getElementById('hud-lv').textContent=P.lv;
  document.getElementById('hud-hp').textContent=P.hp+'/'+P.maxhp;
  document.getElementById('hud-mp').textContent=P.mp+'/'+P.maxmp;
  document.getElementById('hud-gold').textContent=P.gold;
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1400);
}

/* ===================== MODAL SYSTEM ===================== */
let modalOpen=false;
let msgQueue=[], msgCb=null;
const modalLayer=document.getElementById('modal-layer');

function closeModal(){ modalOpen=false; modalLayer.classList.remove('active'); modalLayer.innerHTML=''; }

function message(lines, cb, title){
  if(typeof lines==='string') lines=[lines];
  msgQueue=lines.slice(); msgCb=cb||null;
  modalOpen=true; modalLayer.classList.add('active');
  renderMsg(title);
}
function renderMsg(title){
  const line=msgQueue[0];
  const more = msgQueue.length>1 ? '<div class="more">▼ つづく</div>' : '<div class="more">▼ とじる</div>';
  modalLayer.innerHTML =
    `<div class="dq-window" id="msg-win">
       ${title?`<div class="dq-title">${title}</div>`:''}
       <div class="dq-msg">${line}${more}</div>
     </div>`;
  document.getElementById('msg-win').onclick=modalAdvance;
}
function modalAdvance(){
  if(msgQueue.length<=1){
    const cb=msgCb; msgQueue=[]; msgCb=null;
    closeModal();
    if(cb) cb();
  } else {
    msgQueue.shift();
    const titleEl=modalLayer.querySelector('.dq-title');
    renderMsg(titleEl?titleEl.textContent:null);
  }
}

// generic option menu
function menu(title, options, opts){
  opts=opts||{};
  modalOpen=true; modalLayer.classList.add('active');
  const grid = opts.grid ? 'dq-grid2' : '';
  let html=`<div class="dq-window"><div class="dq-title">${title}</div><div class="dq-options ${grid}">`;
  options.forEach((o,i)=>{
    const right = o.price!=null ? `<span class="price">${o.price}G</span>` : (o.right?`<span class="sub">${o.right}</span>`:'');
    html+=`<button class="dq-opt" data-i="${i}" ${o.disabled?'disabled':''}><span>${o.label}</span>${right}</button>`;
  });
  html+=`</div></div>`;
  modalLayer.innerHTML=html;
  modalLayer.querySelectorAll('.dq-opt').forEach(b=>{
    b.onclick=()=>{ const o=options[+b.dataset.i]; if(o.disabled)return; o.onClick&&o.onClick(); };
  });
}

/* ===================== MAIN MENU (field) ===================== */
function openMainMenu(){
  if(modalOpen||gameOver) return;
  if(!document.getElementById('field-screen').classList.contains('active')) return;
  menu('メニュー', [
    { label:'つよさ', onClick:showStatus },
    { label:'じゅもん', onClick:()=>fieldSpellMenu() },
    { label:'どうぐ', onClick:()=>fieldItemMenu() },
    { label:'とじる', onClick:closeModal },
  ], {grid:true});
}
function showStatus(){
  const w = WEAPONS[P.weapon].name, a=ARMORS[P.armor].name, s=SHIELDS[P.shield].name;
  const next = expForLevel(P.lv+1) - P.exp;
  const rows = [
    ['なまえ', P.name],['レベル', P.lv],
    ['HP', P.hp+' / '+P.maxhp],['MP', P.mp+' / '+P.maxmp],
    ['こうげき力', playerAtk()],['しゅび力', playerDef()],
    ['ちから', P.str],['すばやさ', P.agi],
    ['ゴールド', P.gold+' G'],
    ['つぎのLvまで', P.bossDefeated?'-':next+' EXP'],
    ['ぶき', w],['よろい', a],['たて', s],
  ];
  let html=`<div class="dq-window"><div class="dq-title">つよさ</div>`;
  rows.forEach(r=>{ html+=`<div class="status-row"><span>${r[0]}</span><span>${r[1]}</span></div>`; });
  html+=`<div class="dq-options"><button class="dq-opt" onclick="closeModal()" style="justify-content:center">とじる</button></div></div>`;
  modalOpen=true; modalLayer.classList.add('active'); modalLayer.innerHTML=html;
}
function fieldSpellMenu(){
  const heals = P.spells.filter(k=>SPELLS[k].type==='heal');
  if(!heals.length){ message('使える じゅもんは ない。', openMainMenu); return; }
  const opts = heals.map(k=>{
    const sp=SPELLS[k];
    return { label:sp.name, right:'MP'+sp.mp, disabled:P.mp<sp.mp, onClick:()=>fieldCastHeal(k) };
  });
  opts.push({ label:'← もどる', onClick:openMainMenu });
  menu('じゅもん', opts);
}
function fieldCastHeal(key){
  const sp=SPELLS[key];
  if(P.mp<sp.mp){ return; }
  if(P.hp>=P.maxhp){ message('HPは まんたんだ。', openMainMenu); return; }
  P.mp-=sp.mp;
  const heal=randInt(sp.min,sp.max);
  P.hp=Math.min(P.maxhp,P.hp+heal);
  updateHud(); saveGame();
  message(`${P.name}は ${sp.name}を となえた！\nHPが ${heal} 回復した。`, openMainMenu);
}
function fieldItemMenu(){
  const owned = Object.keys(P.items).filter(k=>P.items[k]>0);
  if(!owned.length){ message('どうぐを もっていない。', openMainMenu); return; }
  const opts=owned.map(k=>({
    label:ITEMS[k].name, right:'×'+P.items[k], onClick:()=>fieldUseItem(k)
  }));
  opts.push({ label:'← もどる', onClick:openMainMenu });
  menu('どうぐ', opts);
}
function fieldUseItem(key){
  const it=ITEMS[key];
  if(it.use==='heal'){
    if(P.hp>=P.maxhp){ message('HPは まんたんだ。', fieldItemMenu); return; }
    P.items[key]--; P.hp=Math.min(P.maxhp,P.hp+it.power);
    updateHud(); saveGame();
    message(`${it.name}を つかった。\nHPが ${it.power} 回復した。`, fieldItemMenu);
  } else if(it.use==='mp'){
    if(P.mp>=P.maxmp){ message('MPは まんたんだ。', fieldItemMenu); return; }
    P.items[key]--; P.mp=Math.min(P.maxmp,P.mp+it.power);
    updateHud(); saveGame();
    message(`${it.name}を つかった。\nMPが ${it.power} 回復した。`, fieldItemMenu);
  } else if(it.use==='warp'){
    P.items[key]--;
    closeModal();
    player.x=townPos.x; player.y=townPos.y+1; player.facing='down';
    drawMap(); saveGame();
    message('キメラのつばさを つかった！\nラダトームの街に もどった。');
  }
}

/* ===================== TOWN ===================== */
function enterTown(){
  // stay on town tile visually; show town menu
  player.x=townPos.x; player.y=townPos.y; drawMap();
  townMenu();
}
function townMenu(){
  menu('ラダトームの街', [
    { label:'🛏️ やどや', right:(P.lv*3)+'G', onClick:inn },
    { label:'🧪 どうぐや', onClick:itemShop },
    { label:'⚔️ ぶきや・よろいや', onClick:armorShop },
    { label:'💬 はなす', onClick:townTalk },
    { label:'🚪 街を でる', onClick:leaveTown },
  ]);
}
function inn(){
  const cost=P.lv*3;
  if(P.hp===P.maxhp&&P.mp===P.maxmp){ message('元気そうですね。\nまた どうぞ。', townMenu, 'やどや'); return; }
  if(P.gold<cost){ message(`${cost}G いただきます…\nおや、足りないようだ。`, townMenu, 'やどや'); return; }
  menu('やどや', [
    { label:`泊まる（${cost}G）`, onClick:()=>{
        P.gold-=cost; P.hp=P.maxhp; P.mp=P.maxmp; updateHud(); saveGame();
        message('おやすみなさい…\n☀️ 朝です！ HPとMPが 全回復した。', townMenu, 'やどや');
      }},
    { label:'やめる', onClick:townMenu },
  ]);
}
function itemShop(){
  const opts=Object.keys(ITEMS).map(k=>{
    const it=ITEMS[k];
    return { label:`${it.name}（${it.desc}）`, price:it.price, onClick:()=>buyItem(k) };
  });
  opts.push({ label:'← もどる', onClick:townMenu });
  menu(`どうぐや  もちきん:${P.gold}G`, opts);
}
function buyItem(key){
  const it=ITEMS[key];
  if(P.gold<it.price){ message('お金が 足りないよ。', itemShop); return; }
  if((P.items[key]||0)>=9){ message('それ以上は 持てないよ。', itemShop); return; }
  P.gold-=it.price; P.items[key]=(P.items[key]||0)+1; updateHud(); saveGame();
  message(`${it.name}を 買った！`, itemShop);
}
function armorShop(){
  menu(`ぶきや・よろいや  もちきん:${P.gold}G`, [
    { label:'⚔️ ぶき', onClick:()=>equipShop('weapon') },
    { label:'🛡️ よろい', onClick:()=>equipShop('armor') },
    { label:'🔰 たて', onClick:()=>equipShop('shield') },
    { label:'← もどる', onClick:townMenu },
  ]);
}
function equipShop(kind){
  const list = kind==='weapon'?WEAPONS : kind==='armor'?ARMORS : SHIELDS;
  const cur = kind==='weapon'?P.weapon : kind==='armor'?P.armor : P.shield;
  const statLabel = kind==='weapon'?'攻':'守';
  const opts=[];
  list.forEach((g,i)=>{
    if(i===0) return; // skip "なし"
    const owned = i<=cur;
    const stat = kind==='weapon'?g.atk:g.def;
    opts.push({
      label:`${g.name}（${statLabel}+${stat}）${owned?' ✓':''}`,
      price: owned?null:g.price, right: owned?'そうび中以下':null,
      disabled: owned,
      onClick:()=>buyEquip(kind,i),
    });
  });
  opts.push({ label:'← もどる', onClick:armorShop });
  menu(`${kind==='weapon'?'ぶき':kind==='armor'?'よろい':'たて'}  もちきん:${P.gold}G`, opts);
}
function buyEquip(kind,i){
  const list = kind==='weapon'?WEAPONS : kind==='armor'?ARMORS : SHIELDS;
  const g=list[i];
  if(P.gold<g.price){ message('お金が 足りないよ。', ()=>equipShop(kind)); return; }
  P.gold-=g.price;
  if(kind==='weapon')P.weapon=i; else if(kind==='armor')P.armor=i; else P.shield=i;
  updateHud(); saveGame();
  message(`${g.name}を 買って そうびした！`, ()=>equipShop(kind));
}
const HINTS = [
  'メタルスライムは 経験値が すごいが すぐ逃げる。会心の一撃を ねらえ！',
  '竜王の城は 北東の 山に かこまれた 場所にある。',
  'ホイミで HPを 回復しながら 戦うのだ。',
  'ロトの そうびが あれば 竜王にも 勝てるだろう。',
  'やどやで 泊まれば HPもMPも 全回復するぞ。',
  'つよい 敵ほど 多くの ゴールドと 経験値を おとす。',
];
function townTalk(){
  message(['街の人「'+HINTS[Math.floor(Math.random()*HINTS.length)]+'」'], townMenu);
}
function leaveTown(){
  closeModal();
  player.x=townPos.x; player.y=townPos.y+1; player.facing='down';
  drawMap(); saveGame();
}

/* ===================== BOSS APPROACH ===================== */
function approachBoss(){
  if(P.bossDefeated){
    player.x=bossPos.x; player.y=bossPos.y+1; drawMap();
    message('竜王は もういない。\n世界は 平和だ。');
    return;
  }
  player.x=bossPos.x; player.y=bossPos.y; drawMap();
  menu('竜王の城', [
    { label:'⚔️ 竜王に いどむ', onClick:()=>{ closeModal(); startBoss(); } },
    { label:'🚪 引き返す', onClick:()=>{ closeModal(); player.x=bossPos.x; player.y=bossPos.y+1; player.facing='down'; drawMap(); } },
  ]);
}

/* ===================== BATTLE ===================== */
let E=null, inBattle=false, battleBusy=false, isBoss=false, bossPhase=0;
let runFailedFlee=false;
const stageEl=document.getElementById('battle-stage');
const spriteEl=document.getElementById('enemy-sprite');

function makeEnemy(key){
  const b=ENEMIES[key];
  return Object.assign({key}, b, { maxhp:b.hp, hp:b.hp, asleep:false, sleepTurns:0 });
}
function startEncounter(tier){
  const pool=POOLS[Math.min(tier,POOLS.length-1)];
  const key=pool[Math.floor(Math.random()*pool.length)];
  E=makeEnemy(key);
  isBoss=false; bossPhase=0;
  beginBattle(`${E.name}が あらわれた！`);
}
function startBoss(){
  E=makeEnemy('knight'); // placeholder, override
  E = { key:'dragonlord', name:'りゅうおう', sprite:'🤴', hp:130, maxhp:130, atk:75, def:36, exp:0, gold:0, spells:['begirama','behoimi'], asleep:false, sleepTurns:0 };
  isBoss=true; bossPhase=1;
  beginBattle('りゅうおう「よくぞ ここまで来た…\nわが 力の前に ひざまずくがよい！」');
}
function beginBattle(introMsg){
  inBattle=true; battleBusy=true; runFailedFlee=false;
  stageEl.classList.toggle('boss', isBoss);
  spriteEl.textContent=E.sprite;
  spriteEl.className='enemy-sprite';
  document.getElementById('enemy-name').textContent=E.name;
  updateEnemyHp();
  showScreen('battle-screen');
  updateBattleStatus();
  hideSub();
  showCmds(false);
  battleMsg(introMsg);
  setTimeout(()=>{ battleBusy=false; showCmds(true); battleMsg('コマンドを えらべ。'); }, isBoss?1400:700);
}
function updateEnemyHp(){
  const pct=Math.max(0,E.hp/E.maxhp*100);
  const bar=document.getElementById('enemy-hp-bar');
  bar.style.width=pct+'%';
  bar.style.background = pct>30?'var(--hp)':'var(--hp-low)';
}
function updateBattleStatus(){
  document.getElementById('b-hp').textContent=P.hp;
  document.getElementById('b-maxhp').textContent=P.maxhp;
  document.getElementById('b-mp').textContent=P.mp;
  document.getElementById('b-maxmp').textContent=P.maxmp;
  document.getElementById('b-lv').textContent=P.lv;
  document.getElementById('b-gold').textContent=P.gold;
  const hpb=document.getElementById('b-hp-bar');
  const hpPct=P.hp/P.maxhp*100;
  hpb.style.width=hpPct+'%';
  hpb.style.background = hpPct>25?'var(--hp)':'var(--hp-low)';
  document.getElementById('b-mp-bar').style.width=(P.maxmp?P.mp/P.maxmp*100:0)+'%';
}
function battleMsg(m){ document.getElementById('battle-msg').textContent=m; }
function showCmds(show){ document.getElementById('battle-cmds').style.display=show?'grid':'none'; }
function hideSub(){ const s=document.getElementById('battle-sub'); s.classList.remove('visible'); s.innerHTML=''; }
function showSub(html){ const s=document.getElementById('battle-sub'); s.innerHTML=html; s.classList.add('visible'); }
function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

/* battle animations */
function enemyHitAnim(){
  document.getElementById('scene-flash').classList.remove('flash'); void document.getElementById('scene-flash').offsetWidth;
  document.getElementById('scene-flash').classList.add('flash');
  spriteEl.classList.remove('anim-ehit'); void spriteEl.offsetWidth; spriteEl.classList.add('anim-ehit');
}
function playerHitAnim(){
  const bs=document.getElementById('battle-screen');
  bs.classList.remove('shake'); void bs.offsetWidth; bs.classList.add('shake');
}

/* command: attack */
async function cmdAttack(){
  if(battleBusy) return;
  await playerTurn(()=>doPlayerAttack());
}
async function doPlayerAttack(){
  const atk=playerAtk();
  const crit = Math.random()<1/24;
  let dmg;
  if(crit){ dmg=Math.max(1,Math.floor(atk*randInt(95,115)/100)); }
  else { dmg=Math.max(1, Math.floor((atk - E.def/2) * (0.85+Math.random()*0.3))); }
  if(E.def>=50 && !crit){ dmg = randInt(0,1); } // metal-like
  battleMsg(`${P.name}の こうげき！`);
  await delay(450);
  enemyHitAnim();
  E.hp=Math.max(0,E.hp-dmg); updateEnemyHp();
  battleMsg(crit?`かいしんの いちげき！\n${E.name}に ${dmg}の ダメージ！`:`${E.name}に ${dmg}の ダメージ！`);
  await delay(700);
}

/* command: spell */
function cmdSpell(){
  if(battleBusy) return;
  if(!P.spells.length){ battleMsg('じゅもんを おぼえていない。'); return; }
  let html='';
  P.spells.forEach(k=>{
    const sp=SPELLS[k];
    const dis=P.mp<sp.mp;
    html+=`<button class="cmd-btn" ${dis?'disabled':''} onclick="castSpell('${k}')">${sp.name} <small style="opacity:.7">MP${sp.mp}</small></button>`;
  });
  html+=`<button class="cmd-btn" onclick="backToCmds()">← もどる</button>`;
  showCmds(false); showSub(`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${html}</div>`);
}
function backToCmds(){ hideSub(); showCmds(true); battleMsg('コマンドを えらべ。'); }
async function castSpell(key){
  if(battleBusy) return;
  const sp=SPELLS[key];
  if(P.mp<sp.mp) return;
  hideSub();
  await playerTurn(async()=>{
    P.mp-=sp.mp; updateBattleStatus();
    battleMsg(`${P.name}は ${sp.name}を となえた！`);
    await delay(550);
    if(sp.type==='heal'){
      const heal=randInt(sp.min,sp.max);
      P.hp=Math.min(P.maxhp,P.hp+heal); updateBattleStatus();
      battleMsg(`HPが ${heal} 回復した！`);
      await delay(650);
    } else if(sp.type==='attack'){
      let dmg=randInt(sp.min,sp.max);
      if(isBoss) dmg=Math.floor(dmg*0.7); // boss resists a bit
      enemyHitAnim();
      E.hp=Math.max(0,E.hp-dmg); updateEnemyHp();
      battleMsg(`${E.name}に ${dmg}の ダメージ！`);
      await delay(650);
    } else if(sp.type==='sleep'){
      if(isBoss){ battleMsg(`しかし ${E.name}には きかなかった！`); await delay(650); }
      else if(Math.random()<0.75){ E.asleep=true; E.sleepTurns=randInt(2,4); battleMsg(`${E.name}は ねむってしまった！`); await delay(650); }
      else { battleMsg('しかし きかなかった！'); await delay(650); }
    }
  });
}

/* command: item */
function cmdItem(){
  if(battleBusy) return;
  const owned=Object.keys(P.items).filter(k=>P.items[k]>0 && ITEMS[k].use!=='warp');
  if(!owned.length){ battleMsg('使える どうぐが ない。'); return; }
  let html='';
  owned.forEach(k=>{ html+=`<button class="cmd-btn" onclick="useBattleItem('${k}')">${ITEMS[k].name} <small style="opacity:.7">×${P.items[k]}</small></button>`; });
  html+=`<button class="cmd-btn" onclick="backToCmds()">← もどる</button>`;
  showCmds(false); showSub(`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${html}</div>`);
}
async function useBattleItem(key){
  if(battleBusy) return;
  const it=ITEMS[key];
  hideSub();
  await playerTurn(async()=>{
    P.items[key]--;
    battleMsg(`${P.name}は ${it.name}を つかった！`);
    await delay(500);
    if(it.use==='heal'){ P.hp=Math.min(P.maxhp,P.hp+it.power); updateBattleStatus(); battleMsg(`HPが ${it.power} 回復した！`); }
    else if(it.use==='mp'){ P.mp=Math.min(P.maxmp,P.mp+it.power); updateBattleStatus(); battleMsg(`MPが ${it.power} 回復した！`); }
    await delay(650);
  });
}

/* command: run */
async function cmdRun(){
  if(battleBusy) return;
  if(isBoss){ battleMsg('にげられない！'); return; }
  battleBusy=true; showCmds(false); hideSub();
  battleMsg(`${P.name}は にげだした！`);
  await delay(600);
  const enemyFast = E.agi && E.agi>50;
  if(!enemyFast && Math.random()<0.6){
    battleMsg('うまく にげきれた！');
    await delay(700);
    endBattle('run');
  } else {
    battleMsg('しかし まわりこまれて しまった！');
    await delay(800);
    await enemyTurn();
    if(!gameOver){ battleBusy=false; showCmds(true); battleMsg('コマンドを えらべ。'); }
  }
}

/* turn flow: run player action, check enemy death/flee, then enemy turn */
async function playerTurn(actionFn){
  battleBusy=true; showCmds(false); hideSub();
  await actionFn();
  if(E.hp<=0){ await enemyDefeated(); return; }
  // metal slime may flee
  if(E.flee && Math.random()<0.5){
    battleMsg(`${E.name}は にげだした！`);
    await delay(800);
    endBattle('run');
    return;
  }
  await delay(150);
  await enemyTurn();
  if(!gameOver && inBattle){ battleBusy=false; showCmds(true); battleMsg('コマンドを えらべ。'); }
}

async function enemyTurn(){
  if(E.asleep){
    E.sleepTurns--;
    if(E.sleepTurns<=0){ E.asleep=false; battleMsg(`${E.name}は 目を さました！`); }
    else { battleMsg(`${E.name}は ねむっている…`); }
    await delay(800);
    return;
  }
  // boss heal logic
  if(isBoss && E.hp < E.maxhp*0.35 && P.mp!==undefined && Math.random()<0.4){
    battleMsg(`${E.name}は ベホイミを となえた！`);
    await delay(550);
    const heal=randInt(45,70); E.hp=Math.min(E.maxhp,E.hp+heal); updateEnemyHp();
    battleMsg(`${E.name}の HPが 回復した！`);
    await delay(700);
    return;
  }
  // spell-casting enemies
  if(E.spells && E.spells.length && Math.random()<0.45){
    const atkSpells=E.spells.filter(k=>SPELLS[k].type==='attack');
    if(atkSpells.length){
      const k=atkSpells[Math.floor(Math.random()*atkSpells.length)];
      const sp=SPELLS[k];
      battleMsg(`${E.name}は ${sp.name}を となえた！`);
      await delay(550);
      let dmg=randInt(sp.min,sp.max);
      if(isBoss) dmg=Math.floor(dmg*1.6);
      await damagePlayer(dmg);
      return;
    }
  }
  // boss special breath in low phase
  if(isBoss && Math.random()<0.35){
    battleMsg(`${E.name}は はげしい ほのおを はいた！`);
    await delay(550);
    await damagePlayer(randInt(38,55));
    return;
  }
  // normal attack
  const crit = Math.random()<1/40;
  let dmg;
  if(crit) dmg=Math.max(1,Math.floor(E.atk*randInt(100,120)/100));
  else dmg=Math.max(1,Math.floor((E.atk - playerDef()/2)*(0.85+Math.random()*0.3)));
  battleMsg(`${E.name}の こうげき！`);
  await delay(450);
  await damagePlayer(dmg, crit);
}
async function damagePlayer(dmg, crit){
  playerHitAnim();
  P.hp=Math.max(0,P.hp-dmg); updateBattleStatus(); updateHud();
  battleMsg((crit?'いた恨の いちげき！\n':'')+`${P.name}は ${dmg}の ダメージを うけた！`);
  await delay(750);
  if(P.hp<=0){ await playerDied(); }
}

async function enemyDefeated(){
  spriteEl.classList.add('anim-efaint');
  await delay(650);
  if(isBoss){ await bossDefeated(); return; }
  battleMsg(`${E.name}を たおした！`);
  await delay(700);
  P.gold+=E.gold;
  P.exp+=E.exp;
  battleMsg(`経験値 ${E.exp} と ${E.gold}G を てにいれた！`);
  updateHud();
  await delay(900);
  const leveled = await checkLevelUp();
  endBattle('win');
}
async function checkLevelUp(){
  let leveled=false;
  while(P.exp >= expForLevel(P.lv+1)){
    P.lv++;
    const before=levelStats(P.lv-1), after=levelStats(P.lv);
    applyLevel(P.lv,false);
    // heal the gained max on level (DQ keeps current+gain feel: top up missing? we add the delta)
    P.hp=Math.min(P.maxhp, P.hp + (after.maxhp-before.maxhp));
    P.mp=Math.min(P.maxmp, P.mp + (after.maxmp-before.maxmp));
    updateHud();
    battleMsg(`🎉 レベルが ${P.lv} に あがった！`);
    await delay(1100);
    // learn spell
    const learn=SPELL_LEARN.find(s=>s.lv===P.lv && !P.spells.includes(s.key));
    if(learn){ P.spells.push(learn.key); battleMsg(`${SPELLS[learn.key].name}の じゅもんを おぼえた！`); await delay(1100); }
    leveled=true;
  }
  return leveled;
}
function endBattle(result){
  inBattle=false; battleBusy=false;
  saveGame();
  showScreen('field-screen');
  resizeCanvas(); drawMap(); updateHud();
}

async function playerDied(){
  gameOver=true;
  battleMsg(`${P.name}は しんでしまった…`);
  await delay(1400);
  // revive at town, lose half gold (DQ style)
  const lost=Math.floor(P.gold/2);
  P.gold-=lost;
  P.hp=P.maxhp; P.mp=P.maxmp;
  player.x=townPos.x; player.y=townPos.y+1; player.facing='down';
  inBattle=false; battleBusy=false;
  showScreen('field-screen'); resizeCanvas(); drawMap(); updateHud(); saveGame();
  gameOver=false;
  message([`「しなないでくれ…」`, `王さまの 力で 生き返った。`, `しかし ${lost}G を 失った…`], null, 'ぜんめつ');
}

async function bossDefeated(){
  if(bossPhase===1){
    // transform to dragon
    bossPhase=2;
    battleMsg('りゅうおう「ぐ…ぬ…\nならば 真の 姿を 見せてやろう！」');
    await delay(1600);
    spriteEl.classList.remove('anim-efaint');
    spriteEl.textContent='🐉';
    E.sprite='🐉'; E.name='りゅうおう（竜）';
    E.maxhp=170; E.hp=170; E.atk=95; E.def=44;
    E.spells=['begirama'];
    document.getElementById('enemy-name').textContent=E.name;
    updateEnemyHp();
    battleMsg('りゅうおうは おそろしい 竜に へんしんした！');
    await delay(1500);
    battleBusy=false; showCmds(true); battleMsg('コマンドを えらべ。');
    return;
  }
  // final defeat
  P.bossDefeated=true;
  saveGame();
  battleMsg('りゅうおうを たおした！！');
  await delay(1600);
  showEnding();
}
function showEnding(){
  clearSave();
  document.getElementById('ending-title').textContent='竜王を 倒した！';
  document.getElementById('ending-msg').innerHTML =
    'さらわれた姫は 救い出され、<br>世界に 光が もどった。<br><br>勇者の 伝説は、いつまでも<br>語りつがれるだろう。<br><br>― おわり ―';
  document.getElementById('ending-stats').innerHTML =
    `レベル ${P.lv}　／　ゴールド ${P.gold}G<br>こうげき力 ${playerAtk()}　しゅび力 ${playerDef()}`;
  showScreen('ending-screen');
}

/* ===================== INIT ===================== */
(function init(){
  document.getElementById('continue-btn').disabled = !hasSave();
})();
</script>
