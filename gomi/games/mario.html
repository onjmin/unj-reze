<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>マリオ SUPER MARIO</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #5c94fc;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #ui {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
      pointer-events: none;
      color: #fff;
      text-shadow: 2px 2px 0 #000;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 1px;
    }

    #ui .label {
      font-size: 9px;
      color: #fff;
      opacity: 0.9;
    }

    #ui .col {
      display: flex;
      flex-direction: column;
      gap: 1px;
      line-height: 1.25;
    }

    #ui .col.center { align-items: center; }
    #ui .col.right { align-items: flex-end; }

    #controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.28);
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      text-shadow: 1px 1px 0 #000;
      backdrop-filter: blur(2px);
    }

    .btn:active,
    .btn.pressed {
      background: rgba(255, 255, 255, 0.45);
      border-color: rgba(255, 255, 255, 0.85);
      transform: scale(0.94);
    }

    .btn-jump {
      width: 74px;
      height: 74px;
      background: rgba(80, 200, 80, 0.32);
      border-color: rgba(120, 255, 120, 0.7);
      font-size: 15px;
    }

    .btn-run {
      background: rgba(230, 80, 60, 0.32);
      border-color: rgba(255, 120, 100, 0.7);
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 30, 0.86);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      z-index: 20;
      padding: 24px;
      font-family: 'Courier New', monospace;
    }

    #overlay h1 {
      font-size: 34px;
      color: #fc3;
      text-shadow: 3px 3px 0 #c00, 5px 5px 0 rgba(0,0,0,0.4);
      margin-bottom: 4px;
      letter-spacing: 4px;
    }

    #overlay h1.small { font-size: 26px; }

    #overlay .sub {
      font-size: 15px;
      color: #fff;
      margin-bottom: 18px;
    }

    #overlay p {
      font-size: 12px;
      color: #cdd;
      margin-bottom: 6px;
      line-height: 1.5;
    }

    .start-btn {
      margin-top: 22px;
      padding: 14px 38px;
      background: #e52521;
      color: #fff;
      border: 3px solid #fff;
      border-radius: 6px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      box-shadow: 0 4px 0 #7a0a08;
      text-shadow: 1px 1px 0 #7a0a08;
    }

    .start-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a0a08; }

    .hint {
      margin-top: 16px;
      font-size: 10px;
      color: #889;
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas"></canvas>

  <div id="ui">
    <div class="col">
      <span class="label">マリオ</span>
      <span id="score">000000</span>
    </div>
    <div class="col center">
      <span class="label">コイン</span>
      <span>×<span id="coins">00</span></span>
    </div>
    <div class="col center">
      <span class="label">ワールド</span>
      <span id="world">1-1</span>
    </div>
    <div class="col right">
      <span class="label">タイム</span>
      <span id="time">400</span>
    </div>
  </div>

  <div id="controls">
    <div class="btn-group">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
    <div class="btn-group">
      <div class="btn btn-run" id="btn-run">B<br>ダッシュ</div>
      <div class="btn btn-jump" id="btn-jump">A<br>ジャンプ</div>
    </div>
  </div>

  <div id="overlay">
    <h1>マリオ</h1>
    <div class="sub" style="color:#fc3">SUPER MARIO</div>
    <p>◀ ▶ で移動　A でジャンプ</p>
    <p>B を押しながらでダッシュ</p>
    <p style="color:#fc6;margin-top:6px;">敵を踏んづけてやっつけろ！</p>
    <p style="color:#9cf;">？ブロックを叩いてコインを集めて</p>
    <p style="color:#9f9;">旗にたどり着けばクリア！</p>
    <p class="hint">PC: ←→ 移動 / Z・スペース ジャンプ / X ダッシュ</p>
    <button class="start-btn" onclick="startGame()">スタート</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const TILE = 16;
    let W, H, SCALE, VIEW_W, VIEW_H;

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W;
      canvas.height = H;
      // Keep roughly 15 tiles tall so the world feels right on any screen.
      SCALE = H / (15 * TILE);
      VIEW_W = W / SCALE;
      VIEW_H = H / SCALE;
    }
    resize();
    window.addEventListener('resize', resize);

    const keys = { left: false, right: false, jump: false, run: false };
    let jumpHeld = false;            // edge-detection for the jump button
    let gameState = 'title';
    let frameCount = 0;

    let score = 0, coinCount = 0, lives = 3;
    let currentLevel = 0;
    let timeLeft = 400, timeTick = 0;

    // ---- Level definitions ---------------------------------------------------
    // Tile legend:
    //  X ground   B brick   ? question(coin)   P pipe-top  | pipe-body
    //  o coin     g goomba  k koopa   F flag   . empty
    const LEVELS = [
      {
        name: '1-1',
        sky: '#5c94fc',
        rows: [
          '........................................................................................................',
          '........................................................................................................',
          '....................................o.o.o...............................................................',
          '..............................?.....................................................................F...',
          '....................................................................................................|...',
          '...................o...........BB?B...........oo....................................................|...',
          '..........?................................................g.g......................................|...',
          '.......................g.................P.................................k........................|...',
          '......................XX................P|.....BBBB....P............................................|...',
          '..............g......XXXX..............P||.............|.........P..................................|...',
          'XXXXXXXXXXXXXXXXXXXXXXXXXXX...XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX...XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX',
          'XXXXXXXXXXXXXXXXXXXXXXXXXXX...XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX...XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX',
        ],
      },
      {
        name: '1-2',
        sky: '#3868fc',
        rows: [
          '........................................................................................................',
          '..........o.o.o.....................................o.o.o.o.............................................',
          '....................?B?B?...........................................................................F...',
          '..............................................BBBB..................................................|...',
          '...........g..........k.....................................o.o.o...................................|...',
          '.....................XXX.........?......g........g.......BBBBBBB....................g..g.............|...',
          '...........BBB..................BBB...........................................P.....................|...',
          '.......................g.k.................P..........k.....................P|......................|...',
          '..............XXXX....XXXXXX...............P|......XXXXXX...................P||......................|...',
          '....g........XXXXXX..XXXXXXXX.............P||.....XXXXXXXX.................P|||......................|...',
          'XXXXXXXXXX...XXXXXXXXXXXXXXXX...XXXXXXXXXXXXXXXX..XXXXXXXXXX...XXXXXXXXXXXXXXXXXXXX...XXXXXXXXXXXXXXXXXX',
          'XXXXXXXXXX...XXXXXXXXXXXXXXXX...XXXXXXXXXXXXXXXX..XXXXXXXXXX...XXXXXXXXXXXXXXXXXXXX...XXXXXXXXXXXXXXXXXX',
        ],
      },
      {
        name: '1-3',
        sky: '#2848cc',
        rows: [
          '........................................................................................................',
          '...........o.o...............o.o.o.o.o..................................................................',
          '......?...............BB?BB.........................?.?.?...........................................F...',
          '.................................................................BB?BB..............................|...',
          '..........g.....k........g.g.g..........k.k...........................g.g.g.........................|...',
          '.......BBBB...........BBBB............BBBB.........BBBB...........BBBBBB.............................|...',
          '..................g.....................................g.g................k.k.....................|...',
          '...........P............P..........P...........P...............P...........P.......................|...',
          '..........P|...........P|.........P|..........P|..............P|..........P|........................|...',
          '.........P||..........P||........P||.........P||.............P||.........P||........................|...',
          'XXXXXXXXXXXXX..XXXXXXXXXXXX..XXXXXXXXXXX..XXXXXXXXXX..XXXXXXXXXXXX..XXXXXXXXXXXXXX...XXXXXXXXXXXXXXXXXXX',
          'XXXXXXXXXXXXX..XXXXXXXXXXXX..XXXXXXXXXXX..XXXXXXXXXX..XXXXXXXXXXXX..XXXXXXXXXXXXXX...XXXXXXXXXXXXXXXXXXX',
        ],
      },
    ];

    // ---- Runtime state -------------------------------------------------------
    let level;          // { width, height, tiles[][], sky, name }
    let player;
    let enemies, coins, particles, bumps, floatTexts;
    let flagX;
    let camera = { x: 0 };
    let levelClearTimer = 0;
    let deathTimer = 0;

    const GRAV = 0.45;
    const MAX_FALL = 9;

    function startGame() {
      document.getElementById('overlay').style.display = 'none';
      score = 0; coinCount = 0; lives = 3; currentLevel = 0;
      loadLevel(currentLevel);
      gameState = 'playing';
      loop();
    }

    function loadLevel(idx) {
      const def = LEVELS[idx];
      const rows = def.rows;
      const h = rows.length;
      const w = rows[0].length;
      const tiles = [];
      enemies = [];
      coins = [];
      particles = [];
      bumps = [];
      floatTexts = [];
      flagX = 0;

      for (let y = 0; y < h; y++) {
        tiles[y] = [];
        for (let x = 0; x < w; x++) {
          const c = rows[y][x];
          let t = '.';
          if (c === 'X') t = 'X';
          else if (c === 'B') t = 'B';
          else if (c === '?') t = '?';
          else if (c === 'P') t = 'P';
          else if (c === '|') t = '|';
          else if (c === 'o') { coins.push({ x: x * TILE + 2, y: y * TILE, w: 12, h: 14, anim: Math.random() * 6 }); }
          else if (c === 'g') { enemies.push(makeEnemy('goomba', x * TILE, y * TILE)); }
          else if (c === 'k') { enemies.push(makeEnemy('koopa', x * TILE, y * TILE - TILE)); }
          else if (c === 'F') { flagX = x * TILE; t = 'flag'; }
          tiles[y][x] = t;
        }
      }

      level = { width: w, height: h, tiles, sky: def.sky, name: def.name };

      player = {
        x: 2 * TILE, y: (h - 4) * TILE, w: 12, h: 15,
        vx: 0, vy: 0, dir: 1,
        onGround: false, big: false,
        walkAnim: 0, dead: false, win: false,
        invincible: 0,
      };

      camera.x = 0;
      timeLeft = 400; timeTick = 0;
      levelClearTimer = 0; deathTimer = 0;
      updateHUD();
    }

    function makeEnemy(type, x, y) {
      return {
        type, x, y,
        w: 14, h: type === 'koopa' ? 22 : 14,
        vx: -0.6, vy: 0,
        onGround: false, dead: false, removeAt: 0,
        shell: false, shellMoving: false, anim: 0,
        active: false,
      };
    }

    // ---- Tile helpers --------------------------------------------------------
    function tileAt(tx, ty) {
      if (ty < 0 || ty >= level.height || tx < 0 || tx >= level.width) {
        // Treat out-of-bounds sides as empty, below as empty (fall to death).
        return '.';
      }
      return level.tiles[ty][tx];
    }
    function isSolid(t) {
      return t === 'X' || t === 'B' || t === '?' || t === 'P' || t === '|';
    }
    function solidAtPixel(px, py) {
      return isSolid(tileAt(Math.floor(px / TILE), Math.floor(py / TILE)));
    }

    // ---- Physics: move an AABB and resolve against tilemap -------------------
    function moveEntity(e) {
      // Horizontal
      e.x += e.vx;
      if (e.vx > 0) {
        const tx = Math.floor((e.x + e.w) / TILE);
        for (let ty = Math.floor(e.y / TILE); ty <= Math.floor((e.y + e.h - 1) / TILE); ty++) {
          if (isSolid(tileAt(tx, ty))) { e.x = tx * TILE - e.w; e.vx = 0; e.hitWall = true; break; }
        }
      } else if (e.vx < 0) {
        const tx = Math.floor(e.x / TILE);
        for (let ty = Math.floor(e.y / TILE); ty <= Math.floor((e.y + e.h - 1) / TILE); ty++) {
          if (isSolid(tileAt(tx, ty))) { e.x = (tx + 1) * TILE; e.vx = 0; e.hitWall = true; break; }
        }
      }

      // Vertical
      e.vy += GRAV;
      if (e.vy > MAX_FALL) e.vy = MAX_FALL;
      e.y += e.vy;
      e.onGround = false;
      if (e.vy > 0) {
        const ty = Math.floor((e.y + e.h) / TILE);
        for (let tx = Math.floor(e.x / TILE); tx <= Math.floor((e.x + e.w - 1) / TILE); tx++) {
          if (isSolid(tileAt(tx, ty))) { e.y = ty * TILE - e.h; e.vy = 0; e.onGround = true; break; }
        }
      } else if (e.vy < 0) {
        const ty = Math.floor(e.y / TILE);
        for (let tx = Math.floor(e.x / TILE); tx <= Math.floor((e.x + e.w - 1) / TILE); tx++) {
          if (isSolid(tileAt(tx, ty))) {
            e.y = (ty + 1) * TILE; e.vy = 0; e.headHit = { tx, ty };
            break;
          }
        }
      }
    }

    // ---- Player update -------------------------------------------------------
    function updatePlayer() {
      if (player.win) { updateWinSequence(); return; }
      if (player.dead) return;

      const runMul = keys.run ? 1.8 : 1;
      const accel = 0.4 * runMul;
      const maxSpd = 2.0 * runMul;

      if (keys.left) { player.vx -= accel; player.dir = -1; }
      else if (keys.right) { player.vx += accel; player.dir = 1; }
      else { player.vx *= 0.8; if (Math.abs(player.vx) < 0.05) player.vx = 0; }

      if (player.vx > maxSpd) player.vx = maxSpd;
      if (player.vx < -maxSpd) player.vx = -maxSpd;

      // Jump (variable height): start on press, cut velocity on release.
      if (keys.jump && player.onGround) {
        player.vy = -7.6;
        player.onGround = false;
        spawnPuff(player.x + player.w / 2, player.y + player.h, '#fff');
      }
      if (!keys.jump && player.vy < -3) player.vy = -3;

      player.headHit = null;
      player.hitWall = false;
      moveEntity(player);

      // Bumped a block from below?
      if (player.headHit) bumpBlock(player.headHit.tx, player.headHit.ty);

      // Walk animation
      if (player.onGround && Math.abs(player.vx) > 0.3) player.walkAnim += Math.abs(player.vx) * 0.18;
      else player.walkAnim = 0;

      if (player.invincible > 0) player.invincible--;

      // Reached the flag?
      if (flagX && player.x + player.w > flagX && !player.win) startWin();

      // Fell off the world
      if (player.y > level.height * TILE + 40) playerDie();

      collectCoinsAndEnemies();
    }

    function bumpBlock(tx, ty) {
      const t = tileAt(tx, ty);
      if (t === '?' ) {
        level.tiles[ty][tx] = 'U';   // used block
        bumps.push({ tx, ty, t: 0 });
        spawnFloatCoin(tx * TILE, ty * TILE);
        addScore(200);
        addCoin();
      } else if (t === 'B') {
        // Breakable feel: bounce; break only if big, else just bump.
        bumps.push({ tx, ty, t: 0 });
        if (player.big) {
          level.tiles[ty][tx] = '.';
          for (let i = 0; i < 4; i++) spawnDebris(tx * TILE + 8, ty * TILE + 8);
          addScore(50);
        }
      }
    }

    function collectCoinsAndEnemies() {
      // Coins
      for (let i = coins.length - 1; i >= 0; i--) {
        if (aabb(player, coins[i])) {
          spawnFloatCoin(coins[i].x, coins[i].y);
          coins.splice(i, 1);
          addCoin(); addScore(100);
        }
      }
      // Enemies
      for (const e of enemies) {
        if (e.dead || !e.active) continue;
        if (!aabb(player, e)) continue;

        const stomping = player.vy > 0 && (player.y + player.h) - e.y < 12;

        if (e.type === 'koopa' && e.shell && !e.shellMoving) {
          // Kick the idle shell
          e.shellMoving = true;
          e.vx = (player.x + player.w / 2 < e.x + e.w / 2) ? 3.4 : -3.4;
          player.vy = -3;
          addScore(400);
          continue;
        }

        if (stomping) {
          if (e.type === 'goomba') {
            e.dead = true; e.removeAt = frameCount + 28; e.squash = true;
            spawnFloatText(e.x, e.y, '100');
            addScore(100);
          } else if (e.type === 'koopa') {
            if (!e.shell) { e.shell = true; e.shellMoving = false; e.vx = 0; e.h = 14; e.y += 8; }
            else { e.shellMoving = false; e.vx = 0; }
            addScore(100);
          }
          player.vy = -5.4;   // stomp bounce
        } else if (e.shellMoving) {
          hitPlayer();
        } else {
          hitPlayer();
        }
      }
    }

    function hitPlayer() {
      if (player.invincible > 0 || player.dead || player.win) return;
      if (player.big) {
        player.big = false;
        player.invincible = 90;
        player.h = 15;
      } else {
        playerDie();
      }
    }

    function playerDie() {
      if (player.dead) return;
      player.dead = true;
      player.vy = -8;
      deathTimer = frameCount;
      spawnPuff(player.x + player.w / 2, player.y, '#fff', 8);
    }

    function startWin() {
      player.win = true;
      player.vx = 0;
      player.winPhase = 'slide';
      addScore(2000 + Math.max(0, timeLeft) * 10);
    }

    function updateWinSequence() {
      // Slide down the pole, then walk right, then advance.
      const poleBottom = (level.height - 2) * TILE - player.h;
      if (player.winPhase === 'slide') {
        player.x = flagX - player.w + 2;
        if (player.y < poleBottom) { player.y += 2.2; }
        else { player.y = poleBottom; player.winPhase = 'walk'; player.dir = 1; levelClearTimer = frameCount; }
      } else if (player.winPhase === 'walk') {
        player.vy += GRAV;
        player.x += 1.4;
        player.walkAnim += 0.3;
        moveEntity(player);
        if (frameCount - levelClearTimer > 80) {
          advanceLevel();
        }
      }
    }

    function advanceLevel() {
      currentLevel++;
      if (currentLevel >= LEVELS.length) {
        showWinScreen();
      } else {
        showLevelCard();
      }
    }

    // ---- Enemy update --------------------------------------------------------
    function updateEnemies() {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];

        if (e.dead) {
          if (frameCount >= e.removeAt) enemies.splice(i, 1);
          continue;
        }

        if (!e.active) {
          if (e.x < camera.x + VIEW_W + 40 && e.x > camera.x - 40) e.active = true;
          else continue;
        }

        e.anim += 0.1;

        if (e.type === 'koopa' && e.shell && !e.shellMoving) {
          // idle shell, no horizontal movement
          e.vx = 0;
        }

        e.hitWall = false;
        moveEntity(e);

        // Turn around at walls
        if (e.hitWall) {
          if (e.shellMoving) {
            e.vx = -Math.sign(e.vx) * Math.abs(e.vx || 3.4);
          } else if (e.type !== 'koopa' || !e.shell) {
            e.vx = -e.vx || 0.6;
          }
        }

        // Turn around at ledges (only walking enemies)
        if (e.onGround && !(e.shell && !e.shellMoving)) {
          const aheadX = e.vx > 0 ? e.x + e.w + 1 : e.x - 1;
          if (!solidAtPixel(aheadX, e.y + e.h + 2) && !e.shellMoving) {
            e.vx = -e.vx;
          }
        }

        // Keep idle/walking enemies moving
        if (!e.shell && Math.abs(e.vx) < 0.3) e.vx = e.dirSeed || -0.6;
        if (e.shell && e.shellMoving && Math.abs(e.vx) < 0.5) e.vx = 3.4;

        // Moving shells kill other enemies
        if (e.shellMoving) {
          for (const o of enemies) {
            if (o === e || o.dead || !o.active) continue;
            if (aabb(e, o)) {
              o.dead = true; o.removeAt = frameCount + 28; o.squash = true;
              spawnFloatText(o.x, o.y, '200'); addScore(200);
            }
          }
        }

        // Fell off world
        if (e.y > level.height * TILE + 40) enemies.splice(i, 1);
      }
    }

    // ---- Coins / particles / effects ----------------------------------------
    function updateCoins() {
      for (const c of coins) c.anim += 0.12;
    }

    function spawnFloatCoin(x, y) {
      particles.push({ kind: 'coin', x: x + 6, y, vy: -3.4, life: 30, maxLife: 30 });
    }
    function spawnFloatText(x, y, text) {
      floatTexts.push({ x, y, text, life: 40 });
    }
    function spawnPuff(x, y, color, n = 5) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = 0.5 + Math.random() * 1.5;
        particles.push({ kind: 'puff', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 18, maxLife: 18, color, r: 1.5 + Math.random() * 1.5 });
      }
    }
    function spawnDebris(x, y) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.4, s = 2 + Math.random() * 2;
      particles.push({ kind: 'debris', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 50, maxLife: 50, color: '#c84c0c' });
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p.kind === 'coin') { p.y += p.vy; p.vy += 0.18; }
        else { p.x += p.vx; p.y += p.vy; p.vy += 0.2; }
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = bumps.length - 1; i >= 0; i--) {
        bumps[i].t++;
        if (bumps[i].t > 12) bumps.splice(i, 1);
      }
      for (let i = floatTexts.length - 1; i >= 0; i--) {
        floatTexts[i].y -= 0.6; floatTexts[i].life--;
        if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
      }
    }

    // ---- Camera / HUD / time -------------------------------------------------
    function updateCamera() {
      const target = player.x + player.w / 2 - VIEW_W * 0.42;
      camera.x = Math.max(0, Math.min(target, level.width * TILE - VIEW_W));
    }

    function updateTimer() {
      if (player.win || player.dead) return;
      timeTick++;
      if (timeTick >= 40) {
        timeTick = 0;
        timeLeft--;
        document.getElementById('time').textContent = String(Math.max(0, timeLeft));
        if (timeLeft <= 0) playerDie();
      }
    }

    function addScore(n) { score += n; document.getElementById('score').textContent = String(score).padStart(6, '0'); }
    function addCoin() {
      coinCount++;
      if (coinCount >= 100) { coinCount -= 100; lives++; }
      document.getElementById('coins').textContent = String(coinCount).padStart(2, '0');
    }
    function updateHUD() {
      document.getElementById('score').textContent = String(score).padStart(6, '0');
      document.getElementById('coins').textContent = String(coinCount).padStart(2, '0');
      document.getElementById('world').textContent = level.name;
      document.getElementById('time').textContent = String(timeLeft);
    }

    function aabb(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    // ---- Death handling ------------------------------------------------------
    function checkDeath() {
      if (player.dead && frameCount - deathTimer > 90) {
        lives--;
        if (lives <= 0) showGameOver();
        else loadLevel(currentLevel);
      }
    }

    // =========================================================================
    //  RENDERING
    // =========================================================================
    function px(x) { return Math.round((x - camera.x) * SCALE); }
    function py(y) { return Math.round(y * SCALE); }
    function s(v) { return Math.round(v * SCALE); }

    function drawBackground() {
      ctx.fillStyle = level.sky;
      ctx.fillRect(0, 0, W, H);

      // Parallax hills
      const baseY = (level.height - 2) * TILE;
      ctx.fillStyle = 'rgba(120, 220, 110, 0.55)';
      for (let i = 0; i < 8; i++) {
        const hx = (i * 360 + 80) - camera.x * 0.4;
        const sx = ((hx % (level.width * TILE + 400)) + (level.width * TILE + 400)) % (level.width * TILE + 400) - 200;
        drawHill(px2(sx), py(baseY), s(60));
      }
      // Clouds
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      for (let i = 0; i < 10; i++) {
        const cx = (i * 280 + 120) - camera.x * 0.55;
        const span = level.width * TILE + 600;
        const sx = ((cx % span) + span) % span - 300;
        const cy = 30 + (i % 3) * 34;
        drawCloud(px2(sx), py(cy), s(16));
      }
    }
    function px2(worldX) { return Math.round((worldX) * SCALE - 0); } // sx already offset
    function drawHill(x, baseY, r) {
      ctx.beginPath();
      ctx.moveTo(x - r, baseY);
      ctx.quadraticCurveTo(x, baseY - r * 1.3, x + r, baseY);
      ctx.fill();
    }
    function drawCloud(x, y, r) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.arc(x + r, y + r * 0.2, r * 0.85, 0, Math.PI * 2);
      ctx.arc(x - r, y + r * 0.2, r * 0.85, 0, Math.PI * 2);
      ctx.arc(x + r * 0.4, y - r * 0.4, r * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawTiles() {
      const x0 = Math.floor(camera.x / TILE) - 1;
      const x1 = Math.ceil((camera.x + VIEW_W) / TILE) + 1;
      for (let ty = 0; ty < level.height; ty++) {
        for (let tx = Math.max(0, x0); tx < Math.min(level.width, x1); tx++) {
          const t = level.tiles[ty][tx];
          if (t === '.' || t === 'flag') continue;
          let yOff = 0;
          for (const b of bumps) { if (b.tx === tx && b.ty === ty) yOff = -Math.sin(b.t / 12 * Math.PI) * 6; }
          drawTile(t, px(tx * TILE), py(ty * TILE) + s(yOff), tx, ty);
        }
      }
      // Flag pole + flag
      if (flagX) drawFlag();
    }

    function drawTile(t, x, y, tx, ty) {
      const u = TILE * SCALE;
      if (t === 'X') {
        ctx.fillStyle = '#c84c0c';
        ctx.fillRect(x, y, u + 1, u + 1);
        ctx.fillStyle = '#e87838';
        ctx.fillRect(x, y, u + 1, s(3));
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        // brick seams
        const half = u / 2;
        ctx.fillRect(x, y + half, u + 1, s(1));
        ctx.fillRect(x + ((ty % 2) ? half : 0), y, s(1), half);
        ctx.fillRect(x + ((ty % 2) ? 0 : half), y + half, s(1), half);
      } else if (t === 'B') {
        ctx.fillStyle = '#d06424';
        ctx.fillRect(x, y, u + 1, u + 1);
        ctx.fillStyle = '#a84410';
        for (let r = 0; r < 4; r++) {
          ctx.fillRect(x, y + r * (u / 4), u + 1, s(1));
        }
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(x + u / 2, y, s(1), u);
      } else if (t === '?') {
        const blink = Math.floor(frameCount / 20) % 3;
        ctx.fillStyle = blink === 0 ? '#f8b800' : (blink === 1 ? '#fcd000' : '#e8a000');
        ctx.fillRect(x, y, u + 1, u + 1);
        ctx.fillStyle = '#a06000';
        ctx.fillRect(x, y, u + 1, u + 1);
        ctx.fillStyle = blink === 0 ? '#fcd000' : '#f8b800';
        ctx.fillRect(x + s(1.5), y + s(1.5), u - s(3), u - s(3));
        // ? mark
        ctx.fillStyle = '#6b3500';
        ctx.font = `bold ${Math.round(u * 0.7)}px 'Courier New'`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', x + u / 2, y + u / 2 + s(0.5));
      } else if (t === 'U') {
        ctx.fillStyle = '#9c5a18';
        ctx.fillRect(x, y, u + 1, u + 1);
        ctx.fillStyle = '#7a440f';
        ctx.fillRect(x + s(1.5), y + s(1.5), u - s(3), u - s(3));
      } else if (t === 'P' || t === '|') {
        // Pipe (top vs body)
        ctx.fillStyle = '#00a800';
        ctx.fillRect(x, y, u + 1, u + 1);
        ctx.fillStyle = '#58d858';
        ctx.fillRect(x + s(1), y, s(3), u + 1);
        ctx.fillStyle = '#007000';
        ctx.fillRect(x + u - s(4), y, s(3), u + 1);
        if (t === 'P') {
          // rim overhang
          ctx.fillStyle = '#00a800';
          ctx.fillRect(x - s(1.5), y, u + s(3) + 1, s(5));
          ctx.fillStyle = '#58d858';
          ctx.fillRect(x - s(1.5), y, u + s(3) + 1, s(2));
          ctx.fillStyle = '#007000';
          ctx.fillRect(x - s(1.5), y + s(4), u + s(3) + 1, s(1));
        }
      }
    }

    function drawFlag() {
      const u = TILE * SCALE;
      // find pole top: column has '|' tiles; pole drawn along flagX column
      const fx = px(flagX + TILE / 2 - 1);
      const topY = py(3 * TILE);
      const botY = py((level.height - 2) * TILE);
      ctx.fillStyle = '#fff';
      ctx.fillRect(fx, topY, s(2), botY - topY);
      ctx.fillStyle = '#cfcfcf';
      ctx.fillRect(fx, topY, s(1), botY - topY);
      // ball on top
      ctx.fillStyle = '#3cb043';
      ctx.beginPath();
      ctx.arc(fx + s(1), topY, s(3), 0, Math.PI * 2);
      ctx.fill();
      // flag (slides down a touch when won)
      let flagY = topY + s(2);
      if (player.win) flagY = Math.min(botY - s(20), topY + (player.y - 3 * TILE) * SCALE);
      ctx.fillStyle = '#2fb02f';
      ctx.beginPath();
      ctx.moveTo(fx, flagY);
      ctx.lineTo(fx - s(16), flagY + s(6));
      ctx.lineTo(fx, flagY + s(12));
      ctx.closePath();
      ctx.fill();
    }

    function drawCoinsLevel() {
      const u = TILE;
      for (const c of coins) {
        const cx = px(c.x + 6), cy = py(c.y + 8);
        const wob = Math.abs(Math.cos(c.anim));
        ctx.fillStyle = '#fcd000';
        ctx.beginPath();
        ctx.ellipse(cx, cy, s(5) * wob + s(0.5), s(7), 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff080';
        ctx.beginPath();
        ctx.ellipse(cx - s(1), cy, s(1.5) * wob + s(0.3), s(4), 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawEnemies() {
      for (const e of enemies) {
        if (!e.active) continue;
        const ex = px(e.x), ey = py(e.y);
        if (ex < -40 || ex > W + 40) continue;
        const u = SCALE;

        if (e.type === 'goomba') {
          if (e.dead && e.squash) {
            ctx.fillStyle = '#7a4a1a';
            ctx.fillRect(ex, ey + s(10), s(14), s(5));
            continue;
          }
          const wob = (Math.floor(e.anim) % 2) ? 1 : -1;
          // body
          ctx.fillStyle = '#9c5a2a';
          ctx.fillRect(ex + s(1), ey + s(2), s(12), s(9));
          ctx.fillStyle = '#7a4418';
          ctx.fillRect(ex, ey + s(4), s(14), s(6));
          // feet
          ctx.fillStyle = '#3a2410';
          ctx.fillRect(ex + (wob > 0 ? 0 : s(2)), ey + s(11), s(5), s(3));
          ctx.fillRect(ex + s(9) - (wob > 0 ? s(2) : 0), ey + s(11), s(5), s(3));
          // eyes
          ctx.fillStyle = '#fff';
          ctx.fillRect(ex + s(3), ey + s(4), s(3), s(3));
          ctx.fillRect(ex + s(8), ey + s(4), s(3), s(3));
          ctx.fillStyle = '#000';
          ctx.fillRect(ex + s(4), ey + s(5), s(1.5), s(2));
          ctx.fillRect(ex + s(9), ey + s(5), s(1.5), s(2));
          // angry brows
          ctx.fillStyle = '#000';
          ctx.fillRect(ex + s(3), ey + s(3), s(3), s(1.5));
          ctx.fillRect(ex + s(8), ey + s(3), s(3), s(1.5));
        } else { // koopa
          if (e.shell) {
            ctx.fillStyle = '#2c8c2c';
            ctx.beginPath();
            ctx.ellipse(ex + s(7), ey + s(7), s(7), s(6.5), 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#bfe860';
            ctx.beginPath();
            ctx.ellipse(ex + s(7), ey + s(7), s(4.5), s(4), 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#2c8c2c';
            ctx.lineWidth = Math.max(1, s(1));
            ctx.beginPath();
            ctx.moveTo(ex + s(3), ey + s(7)); ctx.lineTo(ex + s(11), ey + s(7));
            ctx.stroke();
            if (e.shellMoving && Math.floor(frameCount / 4) % 2) {
              ctx.fillStyle = 'rgba(255,255,255,0.5)';
              ctx.fillRect(ex, ey, s(14), s(14));
            }
            continue;
          }
          const facing = e.vx < 0 ? -1 : 1;
          // shell body
          ctx.fillStyle = '#2c8c2c';
          ctx.fillRect(ex + s(2), ey + s(6), s(10), s(11));
          ctx.fillStyle = '#bfe860';
          ctx.fillRect(ex + s(3), ey + s(8), s(8), s(7));
          // head
          ctx.fillStyle = '#f8d000';
          ctx.fillRect(ex + (facing > 0 ? s(7) : s(0)), ey, s(7), s(8));
          // eye
          ctx.fillStyle = '#000';
          ctx.fillRect(ex + (facing > 0 ? s(11) : s(2)), ey + s(2), s(2), s(2));
          // feet
          ctx.fillStyle = '#f8a000';
          const wob = (Math.floor(e.anim) % 2) ? 0 : s(2);
          ctx.fillRect(ex + s(2), ey + s(17) - wob, s(4), s(3));
          ctx.fillRect(ex + s(8), ey + s(17) - (s(2) - wob), s(4), s(3));
        }
      }
    }

    function drawPlayer() {
      if (player.dead && !player.win) {
        // death sprite (flipped-ish)
        const ex = px(player.x), ey = py(player.y);
        drawMario(ex, ey, 1, true);
        return;
      }
      const ex = px(player.x), ey = py(player.y);
      if (player.invincible > 0 && Math.floor(player.invincible / 4) % 2) return;
      drawMario(ex, ey, player.dir, false);
    }

    function drawMario(ex, ey, dir, dead) {
      const u = SCALE;
      ctx.save();
      if (dir < 0) { ctx.translate(ex + s(12), ey); ctx.scale(-1, 1); ex = 0; ey = 0; }
      else { ctx.translate(ex, ey); ex = 0; ey = 0; }

      const big = player.big;
      const H0 = big ? 24 : 15;
      // Body proportions scale with big/small; we draw small mario, stretch if big.
      const stepY = big ? s(9) : 0;

      const red = dead ? '#888' : '#e52521';
      const skin = '#fca044';
      const brown = '#7a3b10';
      const blue = '#2038ec';

      const moving = player.onGround && Math.abs(player.vx) > 0.3;
      const step = moving ? Math.floor(player.walkAnim) % 2 : 0;
      const airborne = !player.onGround && !dead;

      // CAP
      ctx.fillStyle = red;
      ctx.fillRect(ex + s(2), ey, s(9), s(3));
      ctx.fillRect(ex + s(7), ey + s(3), s(5), s(2)); // brim
      // FACE
      ctx.fillStyle = skin;
      ctx.fillRect(ex + s(3), ey + s(3), s(8), s(5));
      // hair/sideburn
      ctx.fillStyle = brown;
      ctx.fillRect(ex + s(2), ey + s(4), s(2), s(3));
      // eye
      ctx.fillStyle = '#000';
      ctx.fillRect(ex + s(7), ey + s(4), s(1.5), s(2));
      // moustache
      ctx.fillStyle = brown;
      ctx.fillRect(ex + s(6), ey + s(6), s(5), s(1.5));

      const bodyY = ey + s(8);
      // SHIRT/overalls
      ctx.fillStyle = blue;
      ctx.fillRect(ex + s(2), bodyY, s(9), s(4));
      // arms (red shirt)
      ctx.fillStyle = red;
      if (airborne) {
        ctx.fillRect(ex + s(9), bodyY - s(1), s(4), s(3)); // raised arm
        ctx.fillRect(ex, bodyY, s(3), s(3));
      } else {
        ctx.fillRect(ex + s(10), bodyY + s(1), s(3), s(3));
        ctx.fillRect(ex, bodyY + s(1), s(3), s(3));
      }
      // hands
      ctx.fillStyle = skin;
      if (airborne) ctx.fillRect(ex + s(11), bodyY - s(2), s(2.5), s(2.5));

      // LEGS
      ctx.fillStyle = blue;
      const legY = ey + s(12);
      ctx.fillStyle = brown; // shoes
      if (airborne) {
        ctx.fillRect(ex + s(2), legY, s(5), s(3));
        ctx.fillRect(ex + s(7), legY - s(1), s(5), s(3));
      } else if (step === 0) {
        ctx.fillRect(ex + s(2), legY, s(4), s(3));
        ctx.fillRect(ex + s(8), legY, s(4), s(3));
      } else {
        ctx.fillRect(ex + s(1), legY, s(4), s(3));
        ctx.fillRect(ex + s(9), legY, s(4), s(3));
      }

      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        if (p.kind === 'coin') {
          const cx = px(p.x), cy = py(p.y);
          ctx.fillStyle = '#fcd000';
          const wob = Math.abs(Math.cos(frameCount * 0.4));
          ctx.beginPath();
          ctx.ellipse(cx, cy, s(4) * wob + s(0.5), s(6), 0, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
          ctx.fillStyle = p.color || '#fff';
          const r = s(p.r || 2);
          ctx.fillRect(px(p.x) - r, py(p.y) - r, r * 2, r * 2);
          ctx.globalAlpha = 1;
        }
      }
      // floating score text
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(8 * SCALE)}px 'Courier New'`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const f of floatTexts) {
        ctx.globalAlpha = Math.min(1, f.life / 20);
        ctx.fillText(f.text, px(f.x + 7), py(f.y));
      }
      ctx.globalAlpha = 1;
    }

    // =========================================================================
    //  MAIN LOOP
    // =========================================================================
    function loop() {
      if (gameState !== 'playing') return;
      frameCount++;

      updatePlayer();
      updateEnemies();
      updateCoins();
      updateParticles();
      updateCamera();
      updateTimer();
      checkDeath();

      ctx.clearRect(0, 0, W, H);
      drawBackground();
      drawTiles();
      drawCoinsLevel();
      drawEnemies();
      drawPlayer();
      drawParticles();

      requestAnimationFrame(loop);
    }

    // =========================================================================
    //  SCREENS
    // =========================================================================
    function showLevelCard() {
      gameState = 'card';
      const ov = document.getElementById('overlay');
      ov.innerHTML = `
        <h1 class="small">コースクリア！</h1>
        <div class="sub" style="color:#9f9">ワールド ${LEVELS[currentLevel].name} へ</div>
        <p>スコア: ${String(score).padStart(6, '0')}</p>
        <p>のこり: ${lives} 機</p>
        <button class="start-btn" onclick="continueNext()">つぎへ</button>`;
      ov.style.display = 'flex';
    }
    function continueNext() {
      document.getElementById('overlay').style.display = 'none';
      loadLevel(currentLevel);
      gameState = 'playing';
      loop();
    }

    function showGameOver() {
      gameState = 'over';
      const ov = document.getElementById('overlay');
      ov.innerHTML = `
        <h1 style="color:#e52521;text-shadow:3px 3px 0 #000">ゲームオーバー</h1>
        <div class="sub">またあそんでね</div>
        <p>スコア: ${String(score).padStart(6, '0')}</p>
        <button class="start-btn" onclick="startGame()">リトライ</button>`;
      ov.style.display = 'flex';
    }

    function showWinScreen() {
      gameState = 'win';
      const ov = document.getElementById('overlay');
      ov.innerHTML = `
        <h1 style="color:#fc3;text-shadow:3px 3px 0 #c00">クリア！</h1>
        <div class="sub" style="color:#9f9">おめでとう！ぜんコースクリア！</div>
        <p>さいしゅうスコア: <span style="color:#fff;font-size:18px">${String(score).padStart(6, '0')}</span></p>
        <p>のこり: ${lives} 機</p>
        <button class="start-btn" style="background:#3cb043;box-shadow:0 4px 0 #1a5a1f" onclick="startGame()">もういちど</button>`;
      ov.style.display = 'flex';
    }

    // =========================================================================
    //  CONTROLS  (touch + keyboard)
    // =========================================================================
    function setupControls() {
      const press = {
        'btn-left': () => keys.left = true,
        'btn-right': () => keys.right = true,
        'btn-jump': () => { keys.jump = true; },
        'btn-run': () => keys.run = true,
      };
      const release = {
        'btn-left': () => keys.left = false,
        'btn-right': () => keys.right = false,
        'btn-jump': () => { keys.jump = false; },
        'btn-run': () => keys.run = false,
      };

      Object.keys(press).forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        const down = e => { e.preventDefault(); press[id](); el.classList.add('pressed'); };
        const up = e => { e.preventDefault(); release[id](); el.classList.remove('pressed'); };
        el.addEventListener('touchstart', down, { passive: false });
        el.addEventListener('touchend', up, { passive: false });
        el.addEventListener('touchcancel', up, { passive: false });
        el.addEventListener('mousedown', down);
        el.addEventListener('mouseup', up);
        el.addEventListener('mouseleave', () => { if (el.classList.contains('pressed')) up(new Event('mouseleave')); });
      });

      document.addEventListener('keydown', e => {
        if (e.repeat) return;
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
        if (e.key === 'z' || e.key === 'Z' || e.key === ' ' || e.key === 'ArrowUp') { keys.jump = true; e.preventDefault(); }
        if (e.key === 'x' || e.key === 'X' || e.key === 'Shift') keys.run = true;
      });
      document.addEventListener('keyup', e => {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
        if (e.key === 'z' || e.key === 'Z' || e.key === ' ' || e.key === 'ArrowUp') keys.jump = false;
        if (e.key === 'x' || e.key === 'X' || e.key === 'Shift') keys.run = false;
      });

      // Safety: if the page loses focus or is hidden, release everything so a
      // missed keyup/touchend can never leave the player drifting.
      const releaseAll = () => {
        keys.left = keys.right = keys.jump = keys.run = false;
        document.querySelectorAll('.btn.pressed').forEach(el => el.classList.remove('pressed'));
      };
      window.addEventListener('blur', releaseAll);
      document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
    }

    setupControls();
  </script>
</body>

</html>
